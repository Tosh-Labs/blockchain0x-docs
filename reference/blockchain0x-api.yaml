      type: object
      description: >-
        KPI block for the Earnings page hero + top-row stat cards. All USDC
        fields are decimal strings in 6dp base units so

        precision is preserved across the wire; the web-app formats them via

        the 16.6.A3 `usdcBaseUnitsToFloat` helper. `range` is the resolved

        window the server applied (echoes the request's `range`, or `'custom'`

        when explicit `from`/`to` won).
      required:
        - range
        - totalInboundUsdc
        - txCount
        - avgPaymentUsdc
        - lifetimeInboundUsdc
        - availableToWithdrawUsdc
        - referralEarningsUsdc
