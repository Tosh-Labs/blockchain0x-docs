    get:
      operationId: paymentRequestsGetById
      summary: Singleton lookup by internal UUID.
      description: >-
        Distinct path from the public
        `/v1/payment-requests/{paymentRequestToken}`

        GET because the latter accepts the hosted-URL token (`tok_*`) and

        intentionally elides invoice metadata for unauthenticated callers.

        This route requires a valid bearer (cookie or API key) and returns

        the full invoice shape, agent-fenced for API-key callers.
      tags:
        - payment-requests
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      responses:
        '200':
          description: Payment request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequest'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                token: string
                amountWei: '1000000'
                status: open
                url: https://example.com
                network: mainnet
                createdAt: '2026-01-01T00:00:00Z'
                expiresAt: '2026-01-01T00:00:00Z'
                settledTxHash: >-
                  0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                settledAt: '2026-01-01T00:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/payment-requests/{paymentRequestId}/settle:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: paymentRequestId
        required: true
        schema:
          type: string
          format: uuid
        description: Internal UUID of the invoice (NOT the public hosted-URL token).
    post:
      operationId: paymentRequestsSettle
      summary: Settle an invoice with on-chain proof.
      description: |-
        The payee agent calls this after the payer's on-chain transfer
        confirms. The backend verifies the supplied (txHash, payerAddress,
        amountUsdcVerified) tuple against `transactions` before flipping
        the invoice to `settled` and firing `invoice.settled`. Verification
        failures fire `invoice.settlement_failed`.
      tags:
        - payment-requests
      x-blockchain0x-apikey:
        mode: allow
        scope: receive_money
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestSettleBody'
            example:
              txHash: >-
                0x4e2b1f8a9d4c5e7f6a8b9c0d1e2f3a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5
              payerAddress: '0xabcdef0123456789abcdef0123456789abcdef01'
              amountUsdcVerified: '0.10'
      responses:
        '200':
          description: Invoice settled.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                  - settledTxHash
                  - settledAt
                additionalProperties: false
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                      - settled
                  settledTxHash:
                    type: string
                  settledAt:
                    type: string
                    format: date-time
              example:
                id: pr_01HQX5
                status: settled
                settledTxHash: >-
                  0x4e2b1f8a9d4c5e7f6a8b9c0d1e2f3a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5
                settledAt: '2026-05-29T12:34:56Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |-
            Agent mismatch (invoice belongs to a different agent), or the
            caller's key is not agent-scoped.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |-
            Invoice is no longer in `open` state, OR on-chain verification
            failed (tx not found / unconfirmed, recipient mismatch, amount
            mismatch). The error code distinguishes the case:
            `payment_request.not_settleable`,
            `invoice.settlement_unconfirmed`,
            `invoice.settlement_recipient_mismatch`,
            `invoice.settlement_amount_mismatch`.
      x-codeSamples:
        - lang: typescript
          label: Node
          source: |-
            const settled = await client.paymentRequests.settle({
              paymentRequestId,
              body: {
                txHash: '0x' + 'a'.repeat(64),
                payerAddress: '0x' + 'b'.repeat(40),
                amountUsdcVerified: '25.00',
              },
            });
        - lang: go
          label: Go
          source: "settled, err := client.PaymentRequests.Settle(ctx, \"pr_demo\", blockchain0x.PaymentRequestSettleBody{\n\tTxHash:             \"0x\" + \"a\",\n\tPayerAddress:       \"0x\" + \"b\",\n\tAmountUsdcVerified: \"25.00\",\n})\nif err != nil {\n\tpanic(err)\n}\nfmt.Println(\"settled\", settled.SettledTxHash)"
        - lang: ruby
          label: Ruby
          source: |-
            settled = client.payment_requests.settle(
              'pr_demo',
              { txHash: '0x' + 'a', payerAddress: '0x' + 'b', amountUsdcVerified: '25.00' }
            )
            puts "settled #{settled['settledTxHash']}"
