      parameters:
        - in: query
          name: countryId
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: State catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateList'
              example:
                data:
                  - id: 0
                    name: Example
                    code: string
                    countryId: 1
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/metadata/timezones:
    get:
      operationId: metadataTimezonesList
      summary: List all IANA timezones with offset + region (cacheable indefinitely).
      tags:
        - metadata
      x-blockchain0x-apikey:
        mode: allow
      security: []
      responses:
        '200':
          description: Timezone catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimezoneList'
              example:
                data:
                  - ianaName: Example
                    label: Example
                    utcOffset: 0
                    region: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /.well-known/oauth-protected-resource:
    get:
      operationId: oauthProtectedResourceMetadata
      summary: >-
        RFC 9728 protected-resource metadata (served by the MCP ORIGIN, not this
        API).
      description: >-
        Documented here for discovery-chain completeness: this path is served by
        the MCP resource server's

        origin (mcp.blockchain0x.com / dev-mcp / staging-mcp / local

        mcp.localhost - integrations/mcp-server, NOT the API hosts in

        the servers list above). A path-aware variant exists at

        `/.well-known/oauth-protected-resource/mcp` with the identical

        body. It names this API as the authorization server, which is

        how clients find the RFC 8414 document below. 404 while the

        MCP server's MCP_PUBLIC_BASE_URL / MCP_AUTH_SERVER_URL pair is

        unset.
      tags:
        - oauth
      x-blockchain0x-apikey:
        mode: allow
      security: []
      responses:
        '200':
          description: Protected-resource metadata (RFC 9728).
          content:
            application/json:
              schema:
                type: object
                required:
                  - resource
                  - authorization_servers
                  - bearer_methods_supported
                  - scopes_supported
                additionalProperties: false
                properties:
                  resource:
                    type: string
                    format: uri
                  authorization_servers:
                    type: array
                    items:
                      type: string
                      format: uri
                  bearer_methods_supported:
                    type: array
                    items:
                      type: string
                      enum:
                        - header
                  scopes_supported:
                    type: array
                    items:
                      type: string
              example:
                resource: https://mcp.blockchain0x.com/mcp
                authorization_servers:
                  - https://api.blockchain0x.com
                bearer_methods_supported:
                  - header
                scopes_supported:
                  - read_wallet_metadata
                  - pay_bills
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /.well-known/oauth-authorization-server:
    get:
      operationId: oauthAuthorizationServerMetadata
      summary: RFC 8414 authorization-server metadata (root-level, outside /v1).
      description: |-
        Discovery document MCP clients fetch after the resource server's
        RFC 9728 metadata points them at this origin. 404 while
        OAUTH_AS_ENABLED is off. Served with `Access-Control-Allow-Origin: *`
        (browser-based MCP clients) and a 1h public cache.
      tags:
        - oauth
      x-blockchain0x-apikey:
        mode: allow
      security: []
      responses:
        '200':
          description: Authorization-server metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthServerMetadata'
              example:
                issuer: https://api.blockchain0x.com
                authorization_endpoint: https://api.blockchain0x.com/v1/oauth/authorize
                token_endpoint: https://api.blockchain0x.com/v1/oauth/token
                registration_endpoint: https://api.blockchain0x.com/v1/oauth/register
                revocation_endpoint: https://api.blockchain0x.com/v1/oauth/revoke
                response_types_supported:
                  - code
                grant_types_supported:
                  - authorization_code
                  - refresh_token
                code_challenge_methods_supported:
                  - S256
                token_endpoint_auth_methods_supported:
                  - none
                scopes_supported:
                  - read_wallet_metadata
                  - pay_bills
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived (<=15 min) asymmetric-JWT access token issued by the auth

        flow. See [05-api-design.md
        §Auth](https://github.com/toshlabs-repos/blockchain0x-app/blob/dev/docs/plan/05-api-design.md#auth).
    cookieAuth:
      type: apiKey
      in: cookie
      name: b0x_session
      description: |-
        HttpOnly + SameSite=Lax cookie carrying the same access JWT as
        bearerAuth. Set by `POST /v1/auth/otp/verify`,
        `POST /v1/auth/passkey/assert/verify`, and `POST /v1/auth/session`.
        Cleared on `DELETE /v1/auth/session`. The paired `b0x_refresh`
        cookie is scoped to `Path=/v1/auth/session` so it never travels
        on unrelated calls.
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |-
        `Authorization: Bearer sk_(live|test)_*` API key issued from the
        dashboard. Per-key scopes are `workspace_id + agent_id + mode` at MVP;
        rotation has a 7-day overlap window. §"API key
        lifecycle".
  parameters:
    XNetworkHeader:
      name: X-Network
      in: header
      required: true
      schema:
        type: string
        enum:
          - mainnet
          - testnet
      description: |-
        Selects the network slice the request targets. Workspace-scoped
        responses are filtered to this network; chain-bound writes are
        stamped with it. Required on every non-admin workspace-scoped
        operation.
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: |-
        Opaque client-chosen key dedupes a state-changing request for 24 hours.
        Required on `POST /v1/payments`; optional on every other mutation. A
        replay with the same key and the same request hash returns the cached
        response; a replay with the same key but a different hash returns
        `409 idempotency.conflict`.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: |-
        Opaque pagination cursor returned by the previous page (`page.next` or
        `page.prev`). Omit to fetch the first page.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Page size. Servers cap at 100.
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        pattern: ^[a-zA-Z_][a-zA-Z0-9_]*:(asc|desc)$
      description: |-
        Sort spec in the form `<field>:<asc|desc>`. Allowed fields are listed
        per resource. Defaults are documented per endpoint.
    EarningsRange:
      name: range
      in: query
      required: false
      schema:
        type: string
        enum:
          - 7d
          - 30d
          - 90d
          - all
        default: 30d
      description: |-
        Time window for the Earnings page Range picker.
        Server resolves the window in UTC anchored on `now`; `all` removes
        the floor. If both `range` and explicit `from`/`to` are supplied,
        explicit values win.
    EarningsFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: |-
        Inclusive lower bound (ISO-8601 UTC). When present, overrides `range`'s
        lower bound. Must be strictly less than `to` if both are supplied.
    EarningsTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: |-
        Exclusive upper bound (ISO-8601 UTC). When present, overrides `range`'s
        upper bound. Defaults to server `now` when omitted.
  schemas:
    ErrorEnvelope:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required:
        - code
        - message
        - requestId
      additionalProperties: false
      properties:
        code:
          type: string
          description: |-
            Stable dot-namespaced snake_case error code. Single source of truth
            is `packages/shared/src/types/errors.ts`. Never relied on for
            display copy; use `message` for that.
          example: request.invalid
        message:
          type: string
          description: Human-readable, English. Safe to log; never localized.
          example: Request body failed validation.
        requestId:
          type: string
          description: Per-request id; matches the `x-request-id` response header.
          example: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
        details:
          description: |-
            Optional code-specific payload. Example shapes are documented per
            error code in §Errors.
    PageInfo:
      type: object
      required:
        - next
        - prev
      additionalProperties: false
      properties:
        next:
          type:
            - string
            - 'null'
          description: Opaque cursor for the next page, or null at the end.
        prev:
          type:
            - string
            - 'null'
          description: Opaque cursor for the previous page, or null at the start.
    Network:
      type: string
      enum:
        - mainnet
        - testnet
      description: |-
        Network slice. Carried on every chain-bound response (`Workspace`,
        `AgentWallet`, `Transaction`, `Payment`, `SpendPermission`,
        `EarningsRollup`, `BillingLedgerEntry`, `WebhookDelivery`).
    AuthOtpSendRequest:
      type: object
      required:
        - email
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        intent:
          type: string
          enum:
            - signup
            - signin
          default: signin
    AuthOtpSendResponse:
      type: object
      required:
        - requestId
        - expiresInSeconds
      additionalProperties: false
      properties:
        requestId:
          type: string
        expiresInSeconds:
          type: integer
          minimum: 1
    AuthOtpVerifyRequest:
      type: object
      required:
        - email
        - code
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: ^[0-9]{6}$
    AuthSessionRefreshRequest:
      type: object
      required:
        - refreshToken
      additionalProperties: false
      properties:
        refreshToken:
          type: string
    AuthPasskeyRegisterOptionsRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          maxLength: 80
    AuthPasskeyRegisterVerifyRequest:
      type: object
      required:
        - credential
      additionalProperties: false
      properties:
        credential:
          type: object
          required:
            - id
            - response
          additionalProperties: true
          properties:
            id:
              type: string
            response:
              type: object
              additionalProperties: true
        label:
          type: string
          maxLength: 80
    AuthPasskeyAssertOptionsRequest:
      type: object
      required:
        - email
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
    AuthPasskeyAssertVerifyRequest:
      type: object
      required:
        - credential
      additionalProperties: false
      properties:
        credential:
          type: object
          required:
            - id
            - response
          additionalProperties: true
          properties:
            id:
              type: string
            response:
              type: object
              additionalProperties: true
    AuthPasskeyRenameRequest:
      type: object
      required:
        - label
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
    WebAuthnRegisterOptions:
      type: object
      additionalProperties: true
      description: |-
        WebAuthn registration-options payload (the spec's
        `PublicKey Credential Creation Options` object, relayed verbatim).
      properties:
        challenge:
          type: string
          description: Base64url.
        rp:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
            name:
              type: string
        user:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
            name:
              type: string
            displayName:
              type: string
    WebAuthnAssertOptions:
      type: object
      additionalProperties: true
      description: |-
        WebAuthn assertion-options payload (the spec's
        `PublicKey Credential Request Options` object, relayed verbatim).
      properties:
        challenge:
          type: string
        allowCredentials:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
              type:
                type: string
    Session:
      type: object
      required:
        - accessToken
        - expiresIn
      additionalProperties: false
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access-token TTL in seconds.
        user:
          $ref: '#/components/schemas/User'
    Passkey:
      type: object
      required:
        - id
        - label
        - createdAt
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
    PasskeyPage:
      type: object
      required:
        - data
        - page
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Passkey'
        page:
          $ref: '#/components/schemas/PageInfo'
    User:
      type: object
      required:
        - id
        - email
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type:
            - string
            - 'null'
        locale:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          maxLength: 80
        locale:
          type: string
          pattern: ^[a-z]{2}(-[A-Z]{2})?$
    UserDevice:
      type: object
      required:
        - id
        - label
        - lastSeenAt
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        ipPrefix:
          type:
            - string
            - 'null'
        userAgent:
          type:
            - string
            - 'null'
    UserDevicePage:
      type: object
      required:
        - data
        - page
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserDevice'
        page:
          $ref: '#/components/schemas/PageInfo'
    UserExportJob:
      type: object
      required:
        - id
        - status
        - requestedAt
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - queued
            - building
            - ready
            - failed
            - expired
        requestedAt:
          type: string
          format: date-time
        downloadUrl:
          type:
            - string
            - 'null'
          format: uri
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
    AccountDeletionChallenge:
      type: object
      required:
        - status
        - hasPasskey
      additionalProperties: false
      description: Result of POST /v1/users/me/deletion/challenge (re-auth step 1).
      properties:
        status:
          type: string
          enum:
            - sent
        hasPasskey:
          type: boolean
        webauthn:
          type:
            - object
            - 'null'
          additionalProperties: true
    AccountDeletionConfirm:
      type: object
      required:
        - otp
      additionalProperties: false
      description: Body for POST /v1/users/me/deletion (re-auth step 2 + initiate).
      properties:
        otp:
          type: string
          pattern: ^[0-9]{6}$
          description: The 6-digit code mailed by the challenge step.
        credential:
          type:
            - object
            - 'null'
          additionalProperties: true
        reason:
          type:
            - string
            - 'null'
          maxLength: 500
    AccountDeletionStatus:
      type: object
      required:
        - state
      additionalProperties: false
      description: |-
        Account soft-delete state. `pending_deletion` carries the grace
        countdown; `active` means no deletion is scheduled.
      properties:
        state:
          type: string
          enum:
            - active
            - pending_deletion
        requestedAt:
          type: string
          format: date-time
        finalizesAt:
          type: string
          format: date-time
        daysRemaining:
          type: integer
          minimum: 0
        warnings:
          type: object
          additionalProperties: false
          description: Informational only; never blocks deletion.
          properties:
            ownedWorkspaces:
              type: integer
              minimum: 0
            walletsWithBalance:
              type: integer
              minimum: 0
    Workspace:
      type: object
      required:
        - id
        - slug
        - name
        - network
        - createdAt
      additionalProperties: false
      description: |-
        Workspace metadata. The four `deletion*` fields are present on
        every workspace and read-only - they only flip via the
        owner-initiated soft-delete flow at POST/DELETE
        `/v1/workspaces/{id}/deletion`. When the
        workspace is `active` they are all `null`; when in
        `pending_deletion` `deletionPendingAt` and `deletionFinalizesAt`
        are both set, the optional `deletionRequestedBy` /
        `deletionReason` carry the owner's intent.
      properties:
        id:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$
        name:
          type: string
          maxLength: 80
        network:
          $ref: '#/components/schemas/Network'
        networkModeExplicit:
          type: boolean
        defaultChainId:
          type:
            - string
            - 'null'
        logoUrl:
          type:
            - string
            - 'null'
        timezone:
          type:
            - string
            - 'null'
        billingContactEmail:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        deletionPendingAt:
          type:
            - string
            - 'null'
          format: date-time
          description: NOW() the owner initiated soft-delete; null when active.
        deletionFinalizesAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |-
            Derived: `deletionPendingAt + WORKSPACE_DELETION_GRACE_DAYS`.
            The countdown UI + worker finalizer both key off this value.
            Null when the workspace is active.
        deletionRequestedBy:
          type:
            - string
            - 'null'
          description: User UUID that initiated the pending deletion; null when active.
        deletionReason:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Optional free-text rationale typed by the owner; null when active.
    WorkspaceCreate:
      type: object
      required:
        - slug
        - name
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$
        name:
          type: string
          maxLength: 80
    WorkspaceUpdate:
      type: object
      additionalProperties: false
      description: |-
        Workspace-flavor API keys with
        `manage_workspace_metadata` can edit the public-copy fields
        (description, tagline, brandColor, seoTitle, seoDescription,
        seoKeywords, socialLinks). Identity fields (name, slug,
        networkMode) are silently stripped from API-key inputs -
        dashboard callers retain full edit rights subject to their
        workspace role.
      properties:
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$
        networkMode:
          $ref: '#/components/schemas/Network'
        timezone:
          type:
            - string
            - 'null'
          maxLength: 80
        billingContactEmail:
          type:
            - string
            - 'null'
          format: email
          maxLength: 254
        description:
          type:
            - string
            - 'null'
          maxLength: 2000
          description: Short paragraph rendered on the public workspace card.
        tagline:
          type:
            - string
            - 'null'
          maxLength: 140
          description: One-line tagline.
        brandColor:
          type:
            - string
            - 'null'
          pattern: ^#[0-9a-fA-F]{6}$
          description: Hex color (e.g. "#1a73e8") for theming.
        seoTitle:
          type:
            - string
            - 'null'
          maxLength: 120
        seoDescription:
          type:
            - string
            - 'null'
          maxLength: 320
        seoKeywords:
          type:
            - string
            - 'null'
          maxLength: 320
        socialLinks:
          type:
            - object
            - 'null'
          additionalProperties: false
          properties:
            twitter:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
            github:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
            discord:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
            website:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
            linkedin:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
            farcaster:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
    WorkspacePage:
      type: object
      required:
        - data
        - page
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        page:
          $ref: '#/components/schemas/PageInfo'
    WorkspaceDeletionState:
      type: object
      required:
        - state
        - pendingAt
        - finalizesAt
        - requestedBy
        - reason
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
            - active
            - pending_deletion
            - finalized
          description: >-
            Canonical state literal mirrored from
            `packages/shared/src/workspace/deletion`.
        pendingAt:
          type:
            - string
            - 'null'
          format: date-time
        finalizesAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |-
            Derived `pendingAt + WORKSPACE_DELETION_GRACE_DAYS`. The
            countdown UI ticks against this value.
        requestedBy:
          type:
            - string
            - 'null'
          description: User UUID that initiated the pending deletion.
        requestedByDisplayName:
          type:
            - string
            - 'null'
          description: |-
            Display name of the user that initiated the pending deletion.
            surfaces this on the non-owner lockdown
            screen so the locked-out user knows who to contact. Null when
            the workspace is active or when the user row was hard-deleted.
        requestedByEmail:
          type:
            - string
            - 'null'
          format: email
          description: |-
            Email of the user that initiated the pending deletion. Same
            lockdown-screen use case as `requestedByDisplayName`.
        reason:
          type:
            - string
            - 'null'
          maxLength: 500
    WorkspaceExportJob:
      type: object
      required:
        - id
        - status
        - requestedAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - running
            - ready
            - failed
            - expired
        requestedAt:
          type: string
          format: date-time
        readyAt:
          type:
            - string
            - 'null'
          format: date-time
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |-
            NOW() + `WORKSPACE_EXPORT_RETENTION_DAYS` (default 7d) when
            the worker stamps it ready. After this instant the sweeper
            deletes the MinIO object and flips status to `expired`.
        failedAt:
          type:
            - string
            - 'null'
          format: date-time
        failureReason:
