            - 'null'
          format: date-time
    MfaEnrolmentChallenge:
      type: object
      required:
        - provisioningUri
      additionalProperties: false
      properties:
        provisioningUri:
          type: string
          format: uri
        recoveryCodes:
          type: array
          items:
            type: string
    ApiKey:
      type: object
      required:
        - id
        - prefix
        - scopes
      additionalProperties: false
      properties:
        id:
          type: string
        prefix:
          type: string
          description: First 14 characters of the secret (e.g. `sk_test_abc...`).
        label:
          type:
            - string
            - 'null'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          description: |-
            Wallet-level scopes. For wallet-only keys this
            is the inline scope set. For workspace-flavor
            keys this stays empty - per-wallet scopes live in
            `walletAssignments[*].scopes`.
        agentId:
          type:
            - string
            - 'null'
        workspaceScopes:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceApiKeyScope'
          description: |-
            Workspace-level scopes. Empty for wallet-only
            keys; set on workspace-flavor keys.
        walletAssignments:
          type: array
          description: |-
            Per-wallet scope assignments for workspace-flavor keys.
            Each entry pairs an `agentId` with the wallet scopes the
            key holds on that wallet. Empty for wallet-only keys.
          items:
            type: object
            required:
              - agentId
              - scopes
            additionalProperties: false
            properties:
              agentId:
                type: string
                format: uuid
              scopes:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyScope'
                minItems: 1
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
        rotatedAt:
          type:
            - string
            - 'null'
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
    ApiKeyScope:
      type: string
      description: >-
        §3.1: the closed set of wire-level scopes the dashboard

        offers at create-time. Each entry is enforced by the api-key-auth

        plugin before any handler runs. The names mirror the four

        human-readable checkboxes: - read_wallet_metadata: see balances, txns,
        history, limits - manage_wallet_metadata: + update profile copy
        (tagline, social, about) - identity (name, slug, visibility) stays
        dashboard-only - pay_bills: outbound payments, capped by spend allowance
        - receive_money: create invoices + settle them with on-chain proof
      enum:
        - read_wallet_metadata
        - manage_wallet_metadata
        - pay_bills
        - receive_money
    WorkspaceApiKeyScope:
      type: string
      description: >-
        §3.2: workspace-level wire scopes for workspace-flavor

        API keys. Independent dimension from ApiKeyScope - a key may carry

        both, or only workspace scopes (workspace-only key), or only wallet

        assignments. The names mirror the dashboard checkboxes: -
        read_workspace: read workspace metadata, members, audit log, usage -
        manage_workspace_metadata: + update public copy (description, tagline,
        branding, SEO, social links) - identity (name, slug, default network,
        disabled, ownership transfer) stays dashboard-only forever.
      enum:
        - read_workspace
        - manage_workspace_metadata
    ApiKeyCreate:
      type: object
      additionalProperties: false
      description: >-
        Two shapes are accepted on this body. The server picks the

        flavor by inspecting the fields supplied: 1. Legacy wallet-only key: {
        label, scopes, agentId } - the key is bound to ONE wallet, and scopes
        are inline wallet scopes. 2. Workspace-flavor key: { label,
        workspaceScopes?, walletAssignments?, expiresInDays? } - the key may
        carry workspace-level scopes and / or per-wallet assignments (an entry
        per wallet the operator wants the key to touch). The server enforces the
        §3.4 RBAC matrix at create-time; an over- grant rejects with
        `apikey.role_insufficient_for_grants`. Mixing the two shapes (e.g.
        setting both `scopes` and

        `walletAssignments`) is rejected with `request.invalid`.
      required:
        - label
      properties:
        label:
          type: string
          maxLength: 80
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          minItems: 1
          description: |-
            Wallet-level scopes for a legacy wallet-only key. Pair with
            `agentId`. Mutually exclusive with `walletAssignments` /
            `workspaceScopes`.
        agentId:
          type: string
          format: uuid
          description: |-
            Required for the legacy wallet-only key shape. Forbidden
            for the workspace-flavor shape - workspace keys identify
            their wallets via `walletAssignments[*].agentId`.
        workspaceScopes:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceApiKeyScope'
          description: |-
            Workspace-level scopes. Mutually exclusive with the legacy
            `scopes` field.
        walletAssignments:
          type: array
          items:
            type: object
            required:
              - agentId
              - scopes
            additionalProperties: false
            properties:
              agentId:
                type: string
                format: uuid
              scopes:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyScope'
                minItems: 1
          description: |-
            Per-wallet scope assignments for the workspace-flavor key.
            Every assigned wallet must already be in the caller's
            workspace; the §3.4 RBAC matrix enforces the minter's role
            is high enough to grant each scope being assigned.
        expiresInDays:
          type: integer
          enum:
            - 7
            - 30
            - 60
            - 90
          description: |-
            Optional rotation hint. When set, the key carries an
            `expires_at` of NOW + expiresInDays days. Workspace-flavor
            only; legacy wallet-only keys do not expire by default.
    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required:
            - secret
          additionalProperties: false
          properties:
            secret:
              type: string
              description: The full secret. Shown ONCE; never returned again.
    ApiKeyUsage:
      type: object
      required:
