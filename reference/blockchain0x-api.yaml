        token_endpoint_auth_method:
          type: string
          enum:
            - none
        grant_types:
          type: array
          items:
            type: string
            enum:
              - authorization_code
              - refresh_token
        response_types:
          type: array
          items:
            type: string
            enum:
              - code
        client_name:
          type: string
          maxLength: 255
        client_uri:
          type: string
          maxLength: 2000
        logo_uri:
          type: string
          maxLength: 2000
        scope:
          type: string
          maxLength: 500
        software_id:
          type: string
          maxLength: 255
        software_version:
          type: string
          maxLength: 100
    OAuthClientInformation:
      type: object
      required:
        - client_id
        - client_id_issued_at
        - redirect_uris
        - token_endpoint_auth_method
        - grant_types
        - response_types
      additionalProperties: false
      properties:
        client_id:
          type: string
        client_id_issued_at:
          type: integer
          description: Seconds since the Unix epoch.
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        token_endpoint_auth_method:
          type: string
          enum:
            - none
        grant_types:
          type: array
          items:
            type: string
            enum:
              - authorization_code
              - refresh_token
        response_types:
          type: array
          items:
            type: string
            enum:
              - code
        client_name:
          type: string
        client_uri:
          type: string
        logo_uri:
          type: string
        scope:
          type: string
        software_id:
          type: string
        software_version:
          type: string
    OAuthRegistrationError:
      type: object
      required:
        - error
        - error_description
      additionalProperties: false
      properties:
        error:
          type: string
          enum:
            - invalid_client_metadata
            - invalid_redirect_uri
        error_description:
          type: string
    OAuthConsentDecision:
      type: object
      required:
        - request
        - decision
      additionalProperties: false
      properties:
        request:
          type: string
          description: The HMAC-signed consent-request blob from the authorize redirect.
        decision:
          type: string
          enum:
            - approve
            - deny
        workspaceId:
          type: string
          format: uuid
          description: Required to approve - the ONE workspace the grant is scoped to.
        mode:
          type: string
          enum:
            - test
            - live
          description: Required to approve; the workspace network lock wins on conflict.
        scopes:
          type: array
          items:
            type: string
          description: Optional narrowing of the requested scope set (never widening).
    OAuthTokenRequest:
      type: object
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - refresh_token
        code:
          type: string
          description: Required for authorization_code.
        redirect_uri:
          type: string
          format: uri
          description: >-
            Required for authorization_code; must exactly match the authorize
            request.
        client_id:
          type: string
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: RFC 7636 PKCE verifier (S256 only).
        refresh_token:
          type: string
          description: Required for refresh_token.
        resource:
          type: string
          format: uri
          description: RFC 8707; when sent must match the value bound at authorize time.
    OAuthTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
        - scope
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: Oat_<mode>_ prefixed; 60 min TTL.
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
          description: Ort_<mode>_ prefixed; rotates on every refresh.
        scope:
          type: string
          description: Space-delimited granted scopes.
    OAuthTokenError:
      type: object
      required:
        - error
        - error_description
      additionalProperties: false
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unsupported_grant_type
            - invalid_target
        error_description:
          type: string
    OAuthRevokeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
        token_type_hint:
          type: string
          enum:
            - access_token
            - refresh_token
        client_id:
          type: string
    OAuthGrant:
      type: object
      required:
        - id
        - clientName
        - clientId
        - workspaceId
        - workspaceName
        - mode
        - scopes
        - createdAt
        - lastUsedAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        clientName:
          type:
            - string
            - 'null'
          description: >-
            Self-reported by the client at registration - UNTRUSTED display
            string.
        clientId:
          type: string
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type:
            - string
            - 'null'
        mode:
          type: string
          enum:
            - test
            - live
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
    OAuthGrantList:
      type: object
      required:
        - data
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OAuthGrant'
    OAuthConsentDecisionResult:
      type: object
      required:
        - redirectUrl
      additionalProperties: false
      properties:
        redirectUrl:
          type: string
          format: uri
          description: |-
            The client redirect_uri carrying either code+state (approve)
            or error=access_denied (deny). The consent page navigates here.
    WithdrawalPrepareRequest:
      type: object
      required:
        - toAddress
        - amountUsdc
      additionalProperties: false
      properties:
        toAddress:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        amountUsdc:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
    WithdrawalPrepareResponse:
      type: object
      required:
        - userOpHash
        - smartAccount
        - network
        - netUsdc
        - feeUsdc
        - allowCredentials
      additionalProperties: false
      properties:
        userOpHash:
          description: 0x-prefixed userOpHash the browser must sign with the passkey.
          type: string
          pattern: ^0x[0-9a-fA-F]+$
        userOp:
          description: |-
            The full unsigned userOp (27.1 A8). The browser recomputes the
            userOpHash from this and decodes the calls before signing, so a
            substituted hash or swapped calldata is detected client-side.
          type: object
          additionalProperties: true
        smartAccount:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        network:
          type: string
          enum:
            - mainnet
            - testnet
        netUsdc:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        feeUsdc:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        allowCredentials:
          description: |-
            Credential IDs the browser should pass in `allowCredentials` so
            the WebAuthn prompt targets a known passkey (no username picker).
          type: array
          items:
            type: object
            required:
              - id
              - type
            additionalProperties: false
            properties:
              id:
                type: string
              type:
                type: string
                enum:
                  - public-key
    WithdrawalInitiate:
      type: object
      required:
        - userOpHash
        - signature
      additionalProperties: false
      properties:
        userOpHash:
          description: The userOpHash returned by /withdrawals/prepare.
          type: string
          pattern: ^0x[0-9a-fA-F]+$
        signature:
          type: object
          required:
            - signatureBytes
            - authenticatorData
            - clientDataJSON
          additionalProperties: false
          properties:
            signatureBytes:
              description: >-
                0x-prefixed 64-byte raw P-256 r||s (low-s normalised
                server-side).
              type: string
              pattern: ^0x[0-9a-fA-F]{128}$
            authenticatorData:
              description: Base64url-encoded raw authenticator data bytes.
              type: string
              minLength: 1
              maxLength: 4096
            clientDataJSON:
              description: Base64url-encoded raw clientDataJSON bytes.
              type: string
              minLength: 1
              maxLength: 4096
        emailOtp:
          type: string
          pattern: ^[0-9]{6}$
        remark:
          description: >-
            Optional user-facing accounting note for the withdrawal audit
            record.
          type: string
          minLength: 1
          maxLength: 280
        stepUpFactor:
          description: The additional factor satisfied for a large withdrawal.
          type: string
          enum:
            - totp
            - sms
            - hardware_key
        stepUpProof:
          description: >-
            Proof for `stepUpFactor` (TOTP code, SMS code, or WebAuthn
            assertion).
          type: object
          additionalProperties: true
    WithdrawalExecuteResult:
      type: object
      required:
        - transactionId
        - userOpHash
        - status
        - txHash
      additionalProperties: false
      properties:
        transactionId:
          type: string
        userOpHash:
          type: string
          pattern: ^0x[0-9a-fA-F]+$
        status:
          type: string
          enum:
            - submitted
        txHash:
          description: |-
            Initially the userOpHash (the on-chain tx hash is not yet known
            because the bundler still has to mine the userOp). Poll
            /withdrawals/{transactionId}/receipt to back-fill the real tx hash
            once the userOp is mined.
          type: string
          pattern: ^0x[0-9a-fA-F]+$
    WithdrawalReceipt:
      type: object
      required:
        - status
        - txHash
        - blockNumber
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - pending
            - confirmed
            - failed
        txHash:
          description: On-chain tx hash once the userOp is mined; null until then.
          type:
            - string
            - 'null'
        blockNumber:
          type:
            - string
            - 'null'
    WithdrawalQuote:
      type: object
      required:
        - netUsdc
        - gasEstimateUsdc
        - requiresStepUp
        - requiredFactors
      additionalProperties: false
      properties:
        grossUsdc:
          description: |-
            Total USDC leaving the smart account, equal to the amount
            the user typed. The recipient receives `netUsdc`; the B0X
            fee recipient receives `feeUsdc`. Both legs are batched
            into a single userop so they commit atomically.
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        netUsdc:
          description: USDC delivered to the recipient (gross - fee).
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        feeUsdc:
          description: USDC routed to the B0X fee recipient.
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        feeBps:
          description: Outflow fee in basis points (10000 = 100%).
          type: integer
          minimum: 0
          maximum: 10000
        feeRecipient:
          description: B0X fee-recipient EVM address; null when fee=0.
          type:
            - string
            - 'null'
        gasEstimateUsdc:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        requiresStepUp:
          type: boolean
        requiredFactors:
          type: array
          minItems: 2
          items:
            type: string
            enum:
              - passkey
              - email_otp
              - totp
              - sms
              - hardware_key
    WithdrawalStepUpRequired:
      type: object
      required:
        - code
        - factors
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - withdrawal.requires_step_up
        factors:
          type: array
          minItems: 2
          items:
            type: string
            enum:
              - passkey
              - email_otp
              - totp
              - sms
              - hardware_key
        satisfied:
          type: array
          items:
            type: string
            enum:
              - passkey
              - email_otp
              - totp
              - sms
              - hardware_key
        enrolledExtraFactors:
          description: The extra factors this user has enrolled and may choose from.
          type: array
          items:
            type: string
            enum:
              - totp
              - sms
              - hardware_key
    OnrampSession:
      type: object
      required:
        - hostedUrl
        - sessionToken
        - expiresAt
      additionalProperties: false
      properties:
        hostedUrl:
          type: string
          format: uri
        sessionToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    SpendPermissionSummary:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
            - none
        capUsdc:
          type:
            - string
            - 'null'
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        usedUsdc:
          type:
            - string
            - 'null'
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        remainingUsdc:
          type:
            - string
            - 'null'
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        perTxUsdc:
          type:
            - string
            - 'null'
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        period:
          type:
            - string
            - 'null'
          enum:
            - day
            - week
            - month
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
    SmsVerificationStart:
      type: object
      additionalProperties: false
      properties:
        phone:
          description: E.164 phone number; omit to use the user's verified account phone.
          type: string
          pattern: ^\+[1-9][0-9]{6,14}$
    SmsVerificationCheck:
      type: object
      required:
        - code
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[0-9]{4,8}$
    AgentApiKeyCreate:
      type: object
      required:
        - label
        - scopes
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 80
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          minItems: 1
    AgentWebhookCreate:
      type: object
      required:
        - url
        - events
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          minItems: 1
    TransactionsExportQuery:
      type: object
      required:
        - format
      additionalProperties: false
      properties:
        agentId:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - pending
            - confirmed
            - failed
            - dropped
        direction:
          type: string
          enum:
            - inbound
            - outbound
        format:
          type: string
          enum:
            - csv
  responses:
    BadRequest:
      description: Validation, malformed input, or missing/invalid `X-Network`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            requestInvalid:
              summary: Body failed Zod validation
              value:
                error:
                  code: request.invalid
                  message: Request body failed validation.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
                  details:
                    issues:
                      - path:
                          - name
                        message: Required
            networkHeaderRequired:
              summary: X-Network header missing
              value:
                error:
                  code: network.header_required
                  message: X-Network header is required on workspace-scoped routes.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
    Unauthorized:
      description: Missing or invalid bearer token / API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missingToken:
              value:
                error:
                  code: auth.missing_token
                  message: Authorization header missing.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
    Forbidden:
      description: Token valid but scope insufficient (or network mode locked).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            scopeInsufficient:
              value:
                error:
                  code: auth.forbidden
                  message: Token scope insufficient for this operation.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
    NotFound:
      description: Resource id resolved to no row, or row was scoped out by workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            resourceNotFound:
              value:
                error:
                  code: resource.not_found
                  message: Resource not found.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
    Conflict:
      description: Unique-constraint violation or idempotency-key hash mismatch.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            idempotencyConflict:
              value:
                error:
                  code: idempotency.conflict
                  message: Idempotency-Key reused with a different request body.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
    Gone:
      description: Soft-deleted resource, expired session, or expired upload URL.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaType:
      description: Content-Type other than `application/json` on a JSON route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Request body exceeded the per-route limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Business-rule violation (spend cap, virus scan, evidence invalid).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit exceeded. `Retry-After` header is set.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds the client should wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: Last-resort fallback; never includes a stack trace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unhandled:
              value:
                error:
                  code: internal.unhandled
                  message: Internal server error.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
    BadGateway:
      description: Upstream (RPC / chain provider) rejected the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: A `/ready` dependency is degraded or upstream RPC returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
x-blockchain0x-apikey-scope-labels:
  - wire: read_wallet_metadata
    label: Read wallet metadata
    summary: See balances, transactions, history, and limits.
    description: |-
      Read-only access to balances, transactions, earnings, audit log,
      spend permissions, payment requests, and usage telemetry. The
      minimum scope for any monitoring or reporting agent.
    icon: eye
    sortOrder: 10
  - wire: manage_wallet_metadata
    label: Manage wallet metadata
    summary: Includes read. Also update profile copy (tagline, social, about).
    description: |-
      Superset of "Read wallet metadata". Additionally lets the agent
      update its public-facing profile - tagline, about, SEO copy,
      social links, activity-chart visibility, and avatar URL. Identity
      (name, slug, public visibility, disabled flag) stays
      dashboard-only.
    icon: pencil
    sortOrder: 20
  - wire: pay_bills
    label: Send payments (pay bills)
    summary: Outbound payments, capped by the spend allowance.
    description: |-
      Create outbound payments via the SDK or x402 client. Every payment
      is gated by the spend permission you configured for this agent -
      the API key cannot raise the cap. Combine with "Read" for an
      agent that reconciles its own outflows.
    icon: send
    sortOrder: 30
  - wire: receive_money
    label: Receive payments
    summary: Create invoices, settle them with on-chain proof.
    description: |-
      Create payment requests (invoices) and settle them on-chain via
      x402. Settlement requires a confirmed transaction hash; the
      backend verifies all four of (txHash, payer, amount, recipient)
      before flipping the invoice to "settled". Required for any agent
      that sells anything.
    icon: inbox
    sortOrder: 40
