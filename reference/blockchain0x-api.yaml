        enrolledAt:
          type:
            - string
            - 'null'
          format: date-time
        last4PhoneDigits:
          type:
            - string
            - 'null'
        totpLabel:
          type:
            - string
            - 'null'
        webauthn2faLabel:
          type:
            - string
            - 'null'
        methods:
          type: object
          additionalProperties: false
          required:
            - totp
            - webauthn_2fa
            - sms
          properties:
            totp:
              type: object
              additionalProperties: false
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                enrolledAt:
                  type:
                    - string
                    - 'null'
                  format: date-time
                label:
                  type:
                    - string
                    - 'null'
            webauthn_2fa:
              type: object
              additionalProperties: false
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                enrolledAt:
                  type:
                    - string
                    - 'null'
                  format: date-time
                label:
                  type:
                    - string
                    - 'null'
            sms:
              type: object
