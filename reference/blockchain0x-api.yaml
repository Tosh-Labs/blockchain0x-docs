    AuditEntityType:
      type: string
      enum:
        - workspace
        - agent
        - member
        - passkey
        - session
        - api_key
        - webhook
        - payment_request
        - withdrawal
        - spend_permission
        - export
        - user
        - notification
        - pay_session
        - referral
      description: |-
        Canonical entity-type discriminator written into
        `audit_log.entity_type`. Mirrors the frozen list in
        `packages/shared/src/security/audit.ts`.
    AuditActorRef:
      type: object
      required:
        - kind
        - displayName
        - email
      additionalProperties: false
      properties:
        userId:
          type:
            - string
            - 'null'
        displayName:
          type: string
        email:
          type: string
        avatarUrl:
          type:
            - string
            - 'null'
        kind:
          type: string
          enum:
            - user
            - system
            - agent
            - api_key
      description: >-
        Server-resolved actor for an audit-log row. The backend joins

        `users`, agent rows, and api-key rows in a single LEFT JOIN pass so the
        web-app never does N+1 lookups. System

        events (no `actor_id`) render with `kind='system'`,

        `displayName='System'`, and `email=''`. Agent-as-actor and

        api-key-as-actor surface the agent display name / api-key label

        respectively.
    AuditEntityRef:
      type: object
      required:
        - id
        - type
        - name
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/AuditEntityType'
        name:
          type: string
        href:
          type:
            - string
            - 'null'
      description: |-
        Server-resolved entity for an audit-log row. `name` is the
        human-readable label (workspace name, agent display name, passkey
        label,...). `href` is an in-app link target when one exists
        (e.g. `/wallets/{agentId}` for agents). Deleted entities surface
        `name='(deleted)'` with a null `href`.
    AuditLogEntry:
      type: object
      required:
        - id
        - actor
        - action
        - occurredAt
      additionalProperties: false
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        entity:
          type:
            - string
            - 'null'
        details:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
        actorRef:
          $ref: '#/components/schemas/AuditActorRef'
          description: |-
            Server-resolved actor (added in A2). Always
            present on responses from the enriched route; absent on
            legacy callers that still read `actor` only.
        entityRef:
          oneOf:
            - $ref: '#/components/schemas/AuditEntityRef'
            - type: 'null'
          description: |-
            Server-resolved entity (added in A2). May be
            `null` for events that have no entity context (e.g. system
            health events).
    AuditLogEntryPage:
      type: object
      required:
        - data
        - page
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
        visibilityMode:
          type: string
          enum:
            - workspace_full
            - member_redacted
          description: |-
            Indicates whether the caller is seeing the full workspace
            audit set (Owner/Admin) or a redacted view limited to own-actor
            events + events on entities they have a grant on (other roles).
            Added in B2.
    PaymentRequestCreate:
      type: object
      required:
        - amountWei
      additionalProperties: false
      properties:
        amountWei:
          type: string
          pattern: ^[0-9]+$
        expiresAt:
          type: string
          format: date-time
        agentId:
          type: string
        metadata:
          type: object
          additionalProperties: true
        payerAddress:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          description: |-
            Optional expected-payer pin. When set, settle
            refuses any other claimed payer and requires the settling
            transaction to contain a USDC Transfer from this address.
    PaymentRequest:
      type: object
      required:
        - id
        - token
        - amountWei
        - status
        - network
      additionalProperties: false
      properties:
        id:
          type: string
        token:
          type: string
        amountWei:
          type: string
          pattern: ^[0-9]+$
        status:
          type: string
          description: >-
            Lifecycle states: - open: created, waiting for payment. - completed:
            hosted-checkout path landed an on-chain confirmation. - settled:
            x402 / SDK payer attested a txHash and the backend verified it
            against `transactions`. - expired / cancelled: terminal non-paying
            states.
          enum:
            - open
            - completed
            - settled
            - expired
            - cancelled
        url:
          type: string
          format: uri
        network:
          $ref: '#/components/schemas/Network'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
        settledTxHash:
          type:
            - string
            - 'null'
          description: |-
            On-chain proof attached by the settle endpoint. Non-null only when
            `status = settled`.
        settledAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the backend verified the settlement.
    PaymentRequestPublic:
      type: object
      required:
        - token
        - amountWei
        - status
        - network
      additionalProperties: false
      properties:
        token:
          type: string
        amountWei:
          type: string
          pattern: ^[0-9]+$
        status:
          type: string
          enum:
            - open
            - completed
            - settled
            - expired
            - cancelled
        network:
          $ref: '#/components/schemas/Network'
        merchant:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            slug:
              type: string
    PaymentRequestSettleBody:
      type: object
      required:
        - txHash
        - payerAddress
        - amountUsdcVerified
      additionalProperties: false
      description: |-
        The payer-side agent calls this endpoint
        after broadcasting payment to claim settlement. The backend MUST
        verify the tuple against `transactions` before marking the invoice
        settled - server is the trust anchor, agent is untrusted input.
      properties:
        txHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
          description: Hash of the on-chain transfer that paid the invoice.
        payerAddress:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          description: Address that sent funds. Must match `transactions.from_address`.
        amountUsdcVerified:
          type: string
          pattern: ^[0-9]+(?:\.[0-9]+)?$
          description: |-
            USDC amount the payer claims they sent (human-readable, e.g.
            "0.10"). Backend converts to wei and rejects on mismatch.
    PaymentRequestPage:
      type: object
      required:
        - data
        - page
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRequest'
        page:
          $ref: '#/components/schemas/PageInfo'
    PaymentCreate:
