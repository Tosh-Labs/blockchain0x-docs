openapi: 3.1.0
info:
  title: Blockchain0x Public API
  summary: Non-custodial agent-wallet REST surface (workspace + agent + payments).
  description: >-
    Public REST API that backs `wallet.blockchain0x.com` and every Blockchain0x

    SDK. Authoritative resource catalog lives in

    [docs/plan/05-api-design.md](https://github.com/toshlabs-repos/blockchain0x-app/blob/dev/docs/plan/05-api-design.md);

    this document is the wire-format contract. All workspace-scoped operations
    require the `X-Network` header (mainnet or

    testnet) Mutations accept `Idempotency-Key` Errors follow the canonical
    envelope shape (see the

    `ErrorEnvelope` component). **Workspace soft-delete.** Every `Workspace`
    carries

    four read-only `deletion*` fields - `deletionPendingAt`,

    `deletionFinalizesAt`, `deletionRequestedBy`, and `deletionReason` -

    that flip via the owner-initiated POST/DELETE

    `/v1/workspaces/{id}/deletion` surface. While the workspace is in

    `pending_deletion` every workspace-bound mutation returns HTTP 410

    with `workspace.pending_deletion`; the deletion-status read endpoint

    is the ONE workspace-scoped read non-owners are still allowed to

    make so the lockdown screen + countdown banner can render. A

    companion `/v1/workspaces/{id}/exports` queue powers the data

    export modal in the same Danger zone tab.
  version: 0.0.1
  contact:
    name: Blockchain0x Developer Support
    email: developers@blockchain0x.com
    url: https://docs.blockchain0x.com
  license:
    name: Proprietary
    url: https://blockchain0x.com/terms
  termsOfService: https://blockchain0x.com/terms
servers:
  - url: http://localhost:3001
    description: Local dev (compose:up:local)
  - url: https://dev-api.blockchain0x.com
    description: Development (shared dev environment)
  - url: https://staging-api.blockchain0x.com
    description: Staging (production-shaped)
  - url: https://api.blockchain0x.com
    description: Production
security:
  - bearerAuth: []
  - cookieAuth: []
  - apiKeyAuth: []
tags:
  - name: auth
    description: Email-OTP + passkey authentication, sessions, email change.
  - name: users
    description: Current user profile, devices, data export, deletion.
  - name: workspaces
    description: Workspace, members, invites.
  - name: agents
    description: Agent CRUD, public agent page, spend permissions, verifications, drafts.
  - name: transactions
    description: Transaction history + broadcast of pre-signed transactions.
  - name: balances
    description: Per-agent + workspace balance rollups.
  - name: earnings
    description: Earnings rollups.
  - name: billing
    description: Plan, invoices, checkout (Stripe-backed).
  - name: referrals
    description: Referral codes + payouts.
  - name: security
    description: Active sessions + MFA settings.
  - name: api-keys
    description: API key lifecycle (create, rotate, revoke).
  - name: webhooks
    description: Outbound webhook endpoints + delivery log + test fires.
  - name: pay
    description: Hosted `/pay` autonomous-payment sessions.
  - name: status
    description: Public status snapshot.
  - name: audit-log
    description: Workspace-scoped audit feed.
  - name: payment-requests
    description: Hosted payment requests (unauth one-fetch supported).
  - name: payments
    description: Outflow endpoint (Idempotency-Key mandatory).
  - name: uploads
    description: Signed-URL upload sign + confirm + read.
  - name: chains
    description: Public chain list + per-chain config.
  - name: metadata
    description: Public reference catalog (countries, states, timezones).
  - name: public
    description: Unauthenticated public agent / sitemap surface.
  - name: oauth
    description: |-
      OAuth 2.1 authorization server for MCP custom connectors.
      RFC 8414 metadata + RFC 7591 anonymous dynamic client registration;
      authorize/token/revoke land in later rows. The whole surface 404s
      while OAUTH_AS_ENABLED is off. Network-agnostic: mode is carried
      inside the minted token, so X-Network does not apply here.
paths:
  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
    get:
      operationId: workspacesGet
      summary: Get a workspace.
      tags:
        - workspaces
      x-blockchain0x-apikey:
        mode: allow
        workspaceScope: read_workspace
      responses:
        '200':
          description: Workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: ws_01HQX5
                slug: acme
                name: Acme
                network: mainnet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: workspacesUpdate
      summary: Update a workspace.
      description: |-
        Workspace-flavor API keys with the
        `manage_workspace_metadata` scope can edit the public-copy fields
        (description, tagline, brandColor, seoTitle, seoDescription,
        seoKeywords, socialLinks). Identity fields (name, slug,
        networkMode) are silently stripped from API-key inputs - dashboard
        callers retain full edit rights subject to their workspace role.
      tags:
        - workspaces
      x-blockchain0x-apikey:
        mode: allow
        workspaceScope: manage_workspace_metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
            example:
              description: Treasury & operations workspace.
      responses:
        '200':
          description: Workspace updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: ws_01HQX5
                slug: acme
                name: Acme Holdings
                network: mainnet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{workspaceId}/webhooks:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
    get:
      operationId: workspacesWebhooksList
      summary: List webhook subscriptions for this workspace.
      description: |-
        Workspace-flavor API keys with the
        `read_workspace` scope reach this surface so operator dashboards
        can audit webhook subscriptions without a dashboard session.
        Returns workspace-wide subscriptions (agentId IS NULL +
        agentFilter IS NULL), filtered subscriptions (agentId IS NULL +
        agentFilter NON-NULL), and single-agent subscriptions (agentId
        IS NOT NULL) belonging to this workspace.
      tags:
        - webhooks
      x-blockchain0x-apikey:
        mode: allow
        workspaceScope: read_workspace
      responses:
        '200':
          description: Webhook subscriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointPage'
              example:
                data:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    url: https://example.com
                    events:
                      - string
                    agentId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    agentFilter:
                      - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    signingSecret: sk_test_a1b2c3d4e5f6a7b8c9d0
                    active: true
                    createdAt: '2026-01-01T00:00:00Z'
                page:
                  next: string
                  prev: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
  /v1/agents:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
    get:
      operationId: agentsList
      summary: List agents in the current workspace.
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Agent list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPage'
              example:
                data:
                  - id: agt_01HQX5
                    slug: alpha-bot
                    name: Alpha Bot
                    wallet:
                      address: 0xabc...
                      network: mainnet
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    get:
      operationId: agentsGet
      summary: Get an agent.
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      responses:
        '200':
          description: Agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              example:
                id: agt_01HQX5
                slug: alpha-bot
                name: Alpha Bot
                wallet:
                  address: 0xabc...
                  network: mainnet
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: agentsUpdate
      summary: Update an agent.
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: allow
        scope: manage_wallet_metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
            example:
              name: Alpha Bot 2.0
              disabled: false
      responses:
        '200':
          description: Agent updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              example:
                id: agt_01HQX5
                slug: alpha-bot
                name: Alpha Bot 2.0
                wallet:
                  address: 0xabc...
                  network: mainnet
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{agentId}/public:
    parameters:
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    get:
      operationId: agentsPublicGet
      summary: Get the public-facing agent profile.
      description: Unauthenticated. Powers `PublicAgentPage` and `AddressExplorerPage`.
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      security: []
      responses:
        '200':
          description: Public agent profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPublic'
              example:
                id: agt_01HQX5
                slug: alpha-bot
                name: Alpha Bot
                verifiedDomains:
                  - acme.com
                wallet:
                  address: 0xabc...
                  network: mainnet
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{agentId}/payment-requests:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    post:
      operationId: agentsPaymentRequestCreate
      summary: Create a shareable payment request bound to this wallet.
      description: >-
        Agent-scoped "Create payment request" quick action.

        Pre-binds the agent from the path, requires Developer+ on the wallet,
        and

        returns a shareable hosted URL. `amountUsdc` is optional (open amount
        when

        omitted). Demo mode returns a sandbox URL and writes nothing. The

        workspace-wide surface stays at POST /v1/payment-requests.
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: allow
        scope: receive_money
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                amountUsdc:
                  type: string
                  pattern: ^[0-9]+(\.[0-9]{1,6})?$
                memo:
                  type: string
                  maxLength: 280
            example:
              amountUsdc: '12.50'
              memo: invoice 42
      responses:
        '201':
          description: Payment request created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - url
                additionalProperties: false
                properties:
                  id:
                    type: string
                  url:
                    type: string
                    format: uri
                  amountUsdc:
                    type: string
                    pattern: ^[0-9]+(\.[0-9]{1,6})?$
                  memo:
                    type: string
              example:
                id: pr_01HQX5
                url: https://wallet.blockchain0x.com/pay/tok_abc
                amountUsdc: '12.50'
                memo: invoice 42
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: agentsPaymentRequestsList
      summary: List payment requests for this agent.
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      responses:
        '200':
          description: Page of payment requests scoped to the agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestPage'
              example:
                data:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    token: string
                    amountWei: '1000000'
                    status: open
                    url: https://example.com
                    network: mainnet
                    createdAt: '2026-01-01T00:00:00Z'
                    expiresAt: '2026-01-01T00:00:00Z'
                    settledTxHash: >-
                      0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    settledAt: '2026-01-01T00:00:00Z'
                page:
                  next: string
                  prev: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{agentId}/spend-permissions/summary:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    get:
      operationId: agentsSpendPermissionSummary
      summary: Rolled-up summary of the wallet's active spend permission.
      description: |-
        B7: the single active permission rolled up to
        cap/used/remaining/perTx/expiresAt/status for the Permissions tab card.
        `used` is the sum of confirmed outbound USDC within the active window;
        `status` is none when the wallet has no permission. Requires Viewer+ on
        the wallet.
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      responses:
        '200':
          description: Spend permission summary (status=none when there is none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendPermissionSummary'
              example:
                status: active
                capUsdc: '500'
                usedUsdc: '120.5'
                remainingUsdc: '379.5'
                perTxUsdc: null
                period: day
                expiresAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{agentId}/spend-permissions:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    get:
      operationId: agentsSpendPermsList
      summary: List active spend permissions for an agent.
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      responses:
        '200':
          description: Spend permission list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendPermissionPage'
              example:
                data:
                  - id: sp_01HQX5
                    agentId: agt_01HQX5
                    dailyCapWei: '1000000000000000'
                    network: mainnet
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/agents/{agentId}/spend-permissions/{permissionId}:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
      - in: path
        name: permissionId
        required: true
        schema:
          type: string
    get:
      operationId: agentsSpendPermsGet
      summary: Get a spend permission.
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      responses:
        '200':
          description: Spend permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendPermission'
              example:
                id: sp_01HQX5
                agentId: agt_01HQX5
                dailyCapWei: '1000000000000000'
                network: mainnet
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/transactions/export:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
    get:
      operationId: transactionsExport
      summary: Export this wallet's transactions as a streamed CSV.
      description: >-
        B9: streams a CSV attachment of every matching transaction

        (same filters as the list endpoint, no pagination cap). Requires Viewer+

        on the wallet; agentId is required so the export is scoped to one
        wallet.

        Columns: timestamp, direction, amount, counterparty, reason, txHash,
        fee,

        status, autonomous.
      tags:
        - transactions
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - pending
              - confirmed
              - failed
              - dropped
        - in: query
          name: direction
          required: false
          schema:
            type: string
            enum:
              - inbound
              - outbound
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum:
              - csv
      responses:
        '200':
          description: CSV attachment (text/csv).
          content:
            text/csv:
              schema:
                type: string
              example: >
                timestamp,direction,amount,counterparty,reason,txHash,fee,status,autonomous

                2026-05-20T10:00:00.000Z,outbound,125.5,0xabc...,withdrawal,0xhash...,21000000000000,confirmed,false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/transactions:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
    get:
      operationId: transactionsList
      summary: List transactions visible in the current workspace + network.
      tags:
        - transactions
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - in: query
          name: agentId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum:
              - pending
              - confirmed
              - failed
              - dropped
        - in: query
          name: direction
          schema:
            type: string
            enum:
              - inbound
              - outbound
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Transaction list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
              example:
                data:
                  - id: tx_01HQX5
                    hash: 0xabc...
                    status: confirmed
                    network: mainnet
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: transactionId
        required: true
        schema:
          type: string
    get:
      operationId: transactionsGet
      summary: Get a transaction.
      tags:
        - transactions
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      responses:
        '200':
          description: Transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              example:
                id: tx_01HQX5
                hash: 0xabc...
                status: confirmed
                network: mainnet
        '404':
          $ref: '#/components/responses/NotFound'
      x-codeSamples:
        - lang: typescript
          label: Node
          source: const tx = await client.transactions.get(transactionId);
  /v1/balances:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
    get:
      operationId: balancesList
      summary: List balances across the workspace's agents.
      tags:
        - balances
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
      responses:
        '200':
          description: Balance list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancePage'
              example:
                data:
                  - agentId: agt_01HQX5
                    asset: ETH
                    amountWei: '1000000000000000'
                    network: mainnet
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/earnings:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
    get:
      operationId: earningsList
      summary: List earnings rollups.
      tags:
        - earnings
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/EarningsRange'
        - $ref: '#/components/parameters/EarningsFrom'
        - $ref: '#/components/parameters/EarningsTo'
        - in: query
          name: agentId
          schema:
            type: string
      responses:
        '200':
          description: Earnings rollups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarningsRollupPage'
              example:
                data:
                  - id: er_01HQX5
                    agentId: agt_01HQX5
                    period: 2026-05
                    amountWei: '5000000000000000'
                    network: mainnet
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/earnings/recent-inflows:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
    get:
      operationId: earningsRecentInflows
      summary: Reverse-chronological feed of confirmed USDC inbound transactions.
      description: |-
        B5. Reads the `transactions` table directly so each
        row carries `txHash` + `fromAddress`. Filters: `direction='inbound'`,
        `status='confirmed'`, `token='USDC'`. Cursor is an opaque
        base64url-encoded `(confirmedAt, id)` tuple for stable keyset
        pagination across new inserts at the head of the feed.
      tags:
        - earnings
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EarningsRange'
        - $ref: '#/components/parameters/EarningsFrom'
        - $ref: '#/components/parameters/EarningsTo'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Recent inflows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentInflowsPage'
              example:
                data:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    agentId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    agentName: Example
                    fromAddress: '0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
                    amountUsdc: '10.00'
                    txHash: >-
                      0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    reason: string
                    chainId: 0
                    network: mainnet
