          minimum: 0
        avgPaymentUsdc:
          type: string
          pattern: ^[0-9]+$
        lifetimeInboundUsdc:
          type: string
          pattern: ^[0-9]+$
        availableToWithdrawUsdc:
          type: string
          pattern: ^[0-9]+$
        referralEarningsUsdc:
          type: string
          pattern: ^[0-9]+$
