  /v1/audit-log:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
    get:
      operationId: auditLogList
      summary: List audit-log entries for the current workspace.
      description: |-
        Workspace-scoped audit-log list. enriches every row
        with server-resolved `actorRef` + `entityRef`, drops the default
        page size to 10 (was 25), adds free-text search across action /
        actor displayName / entity name / entity id, plus filter chips
        (actor, action prefix, entity type, date range) and a `sort=`
        token.
      tags:
        - audit-log
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            enum:
              - 10
              - 25
              - 50
              - 100
            default: 10
          description: Page size. One of 10/25/50/100. Unknown values clamp to 10.
        - in: query
          name: actor
          schema:
            type: string
            format: uuid
          description: Filter to a single actor user id.
        - in: query
          name: action
          schema:
            type: string
          description: |-
            Legacy exact-match action filter; prefer `actionPrefix=`.
            Kept for back-compat with callers built before 16.7.
        - in: query
          name: actionPrefix
          schema:
            type: string
            maxLength: 64
          description: |-
            Server-side `LIKE 'prefix%'` filter on the `action` column.
            Example: `withdrawal.` to scope to withdrawal events.
        - in: query
          name: entityType
          schema:
            $ref: '#/components/schemas/AuditEntityType'
        - in: query
          name: q
          schema:
            type: string
            maxLength: 200
          description: |-
            Free-text search; case-insensitive ILIKE across `action`,
            resolved actor displayName, resolved entity name, and the
            raw entity id.
        - in: query
          name: from
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on `created_at` (ISO-8601 UTC).
        - in: query
          name: to
          schema:
            type: string
            format: date-time
          description: Exclusive upper bound on `created_at` (ISO-8601 UTC).
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum:
              - occurredAt:asc
              - occurredAt:desc
              - action:asc
              - action:desc
              - actor:asc
              - actor:desc
              - entity:asc
              - entity:desc
            default: occurredAt:desc
          description: Sort token `<field>:<asc|desc>`. Defaults to `occurredAt:desc`.
      responses:
        '200':
          description: Audit-log list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogEntryPage'
              example:
                data:
                  - id: al_01HQX5
                    actor: user:usr_01HQX5
                    action: workspace.member.added
                    entity: wsm_02HQX5
                    occurredAt: '2026-05-17T09:50:00Z'
                    actorRef:
                      userId: usr_01HQX5
                      displayName: Alex Owner
                      email: alex@example.com
                      avatarUrl: null
                      kind: user
                    entityRef:
                      id: wsm_02HQX5
                      type: member
                      name: Sam Developer
                      href: /workspace/team
                page:
                  next: null
                  prev: null
                visibilityMode: workspace_full
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/audit-log/export:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
    get:
      operationId: auditLogExport
      summary: Stream the filtered audit-log range as CSV or NDJSON.
      description: >-
        Streams the full filtered audit-log range as a downloadable file. Honors
        every filter accepted by

        `GET /v1/audit-log`. Rate-limited to 1 request per minute per

        user; emits its own `audit_log.export.created` row.
      tags:
        - audit-log
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      parameters:
        - in: query
          name: format
          required: true
          schema:
            type: string
            enum:
              - csv
              - json
        - in: query
          name: actor
          schema:
            type: string
            format: uuid
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: actionPrefix
          schema:
            type: string
            maxLength: 64
        - in: query
          name: entityType
          schema:
            $ref: '#/components/schemas/AuditEntityType'
        - in: query
          name: q
          schema:
            type: string
            maxLength: 200
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Streaming export. RFC 4180 CSV or NDJSON, one row per line.
          content:
            text/csv:
              schema:
                type: string
                format: binary
              example: string
            application/x-ndjson:
              schema:
                type: string
                format: binary
              example: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          description: Server-side wall-time cap exceeded; narrow the range.
        '413':
          description: Result-set row cap exceeded; narrow the range.
        '429':
          description: Rate limit exceeded (1 export per minute per user).
