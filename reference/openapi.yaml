              agentId: agt_01HQX5
      responses:
        '201':
          description: API key minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
              example:
                id: ak_01HQX5
                prefix: sk_test_abc
                secret: sk_test_abcDEF...
                scopes:
                  - payments:write
        '401':
          $ref: '#/components/responses/Unauthorized'
