                          type: string
                          format: uuid
                        date:
                          type: string
                          format: date-time
                        agent:
                          type: string
                        agentSlug:
                          type: string
                        amount:
                          type: string
                        token:
                          type: string
                        from:
                          type: string
                          nullable: true
                        chain:
                          type: string
                        network:
                          type: string
                          enum:
                            - mainnet
                            - testnet
                        paymentRequest:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                              format: uuid
                            title:
                              type: string
                              nullable: true
                            reference:
                              type: string
                              nullable: true
                  page:
                    type: object
                    properties:
                      next:
                        type: string
                        nullable: true
                      prev:
                        type: string
                        nullable: true
        '400':
