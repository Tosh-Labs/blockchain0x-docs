        required: true
        schema:
          type: string
    post:
      operationId: agentApiKeyRotate
      summary: Rotate this wallet's API key (quick action).
      description: >
        Sub-plan 16.5.B6 resolver for the wallet detail "Rotate API key" quick

        action. Requires an Admin grant on the wallet. Resolves the agent's

        single active key for the current network and rotates it (7-day
        overlap).

        404 when the wallet has no active key; 409 when it has several (the UI

        then prompts the user to pick one and calls POST
        /v1/api-keys/{id}/rotate).
      tags:
        - api-keys
      responses:
        '200':
          description: New API key minted; predecessor remains valid for 7 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyRotation'
              example:
                predecessor:
                  id: ak_01HQX5
                successor:
                  id: ak_02HQX5
