openapi: 3.1.0
info:
  title: Blockchain0x Public API
  summary: Non-custodial agent-wallet REST surface (workspace + agent + payments).
  description: >
    Public REST API that backs `wallet.blockchain0x.com` and every Blockchain0x

    SDK. Authoritative resource catalog lives in

    [docs/plan/05-api-design.md](https://github.com/toshlabs-repos/blockchain0x-app/blob/dev/docs/plan/05-api-design.md);

    this document is the wire-format contract.


    All workspace-scoped operations require the `X-Network` header (mainnet or

    testnet) per sub-plan 04.5. Mutations accept `Idempotency-Key` per

    sub-plan 05. Errors follow the canonical envelope shape (see the

    `ErrorEnvelope` component).
  version: 0.0.1
  contact:
    name: Blockchain0x Developer Support
    email: developers@blockchain0x.com
    url: https://docs.blockchain0x.com
  license:
    name: Proprietary
    url: https://blockchain0x.com/terms
  termsOfService: https://blockchain0x.com/terms
servers:
  - url: http://localhost:3001
    description: Local dev (compose:up:local)
  - url: https://dev-api.blockchain0x.com
    description: Development (shared dev environment)
  - url: https://staging-api.blockchain0x.com
    description: Staging (production-shaped)
  - url: https://api.blockchain0x.com
    description: Production
security:
  - bearerAuth: []
  - cookieAuth: []
  - apiKeyAuth: []
tags:
  - name: auth
    description: Email-OTP + passkey authentication, sessions, email change.
  - name: users
    description: Current user profile, devices, data export, deletion.
  - name: workspaces
    description: Workspace, members, invites.
  - name: agents
    description: Agent CRUD, public agent page, spend permissions, verifications, drafts.
  - name: transactions
    description: Transaction history + broadcast of pre-signed transactions.
  - name: balances
    description: Per-agent + workspace balance rollups.
  - name: earnings
    description: Earnings rollups.
  - name: billing
    description: Plan, invoices, checkout (Stripe-backed).
  - name: referrals
    description: Referral codes + payouts.
  - name: security
    description: Active sessions + MFA settings.
  - name: api-keys
    description: API key lifecycle (create, rotate, revoke).
  - name: webhooks
    description: Outbound webhook endpoints + delivery log + test fires.
  - name: pay
    description: Hosted `/pay` autonomous-payment sessions.
  - name: status
    description: Public status snapshot.
  - name: audit-log
    description: Workspace-scoped audit feed.
  - name: payment-requests
    description: Hosted payment requests (unauth one-fetch supported).
  - name: payments
    description: Outflow endpoint (Idempotency-Key mandatory).
  - name: uploads
    description: Signed-URL upload sign + confirm + read.
  - name: chains
    description: Public chain list + per-chain config.
paths:
  /v1/auth/otp/send:
    post:
      operationId: authOtpSend
      summary: Request an email OTP.
      description: |
        Queues a one-time code to the supplied email. Always returns 202 so
        callers cannot probe for account existence.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthOtpSendRequest'
            example:
              email: founder@example.com
              intent: signup
      responses:
        '202':
          description: OTP queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOtpSendResponse'
              example:
                requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
                expiresInSeconds: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/auth/otp/verify:
    post:
      operationId: authOtpVerify
      summary: Verify an email OTP and exchange for a session.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthOtpVerifyRequest'
            example:
              email: founder@example.com
              code: '847291'
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                accessToken: eyJhbGciOiJFUzI1NiJ9...
                refreshToken: rt_01HQX5NXY2P3W2YGJ8ZQK5V4G6
                user:
                  id: usr_01HQX5
                  email: founder@example.com
                expiresIn: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/passkey/register/options:
    post:
      operationId: authPasskeyRegisterOptions
      summary: Get WebAuthn registration challenge options.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasskeyRegisterOptionsRequest'
            example:
              displayName: My MacBook
      responses:
        '200':
          description: Options issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnRegisterOptions'
              example:
                challenge: ZGVtby1jaGFsbGVuZ2U
                rp:
                  id: blockchain0x.com
                  name: Blockchain0x
                user:
                  id: usr_01HQX5
                  name: founder@example.com
                  displayName: Founder
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/passkey/register/verify:
    post:
      operationId: authPasskeyRegisterVerify
      summary: Verify a WebAuthn registration response.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasskeyRegisterVerifyRequest'
            example:
              credential:
                id: ZGVtby1jcmVk
                response:
                  clientDataJSON: ...
                  attestationObject: ...
      responses:
        '201':
          description: Passkey registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
              example:
                id: pk_01HQX5
                label: My MacBook
                createdAt: '2026-05-17T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/passkey/assert/options:
    post:
      operationId: authPasskeyAssertOptions
      summary: Get WebAuthn assertion challenge options.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasskeyAssertOptionsRequest'
            example:
              email: founder@example.com
      responses:
        '200':
          description: Options issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnAssertOptions'
              example:
                challenge: ZGVtby1jaGFsbGVuZ2U
                allowCredentials:
                  - id: ZGVtby1jcmVk
                    type: public-key
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/passkey/assert/verify:
    post:
      operationId: authPasskeyAssertVerify
      summary: Verify a WebAuthn assertion and exchange for a session.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasskeyAssertVerifyRequest'
            example:
              credential:
                id: ZGVtby1jcmVk
                response:
                  clientDataJSON: ...
                  authenticatorData: ...
                  signature: ...
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                accessToken: eyJhbGciOiJFUzI1NiJ9...
                refreshToken: rt_01HQX5
                expiresIn: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/session:
    get:
      operationId: authSessionGet
      summary: Get the current session + user.
      tags:
        - auth
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                accessToken: eyJ...
                user:
                  id: usr_01HQX5
                  email: founder@example.com
                expiresIn: 740
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: authSessionRefresh
      summary: Rotate the refresh token and mint a new access token.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSessionRefreshRequest'
            example:
              refreshToken: rt_01HQX5NXY2P3W2YGJ8ZQK5V4G6
      responses:
        '200':
          description: New session issued; previous refresh token revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                accessToken: eyJ...
                refreshToken: rt_01HQX5NEW
                expiresIn: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: authSessionRevoke
      summary: Revoke the current session (log out).
      tags:
        - auth
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/passkeys:
    get:
      operationId: authPasskeysList
      summary: List the current user's registered passkeys.
      tags:
        - auth
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Passkey list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyPage'
              example:
                data:
                  - id: pk_01HQX5
                    label: My MacBook
                    createdAt: '2026-05-17T10:00:00Z'
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: authPasskeysCreate
      summary: >-
        Register a new passkey (server-driven flow alias for
        /v1/auth/passkey/register/verify).
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasskeyRegisterVerifyRequest'
            example:
              credential:
                id: ZGVtby1jcmVk
                response:
                  clientDataJSON: ...
                  attestationObject: ...
              label: My iPhone
      responses:
        '201':
          description: Passkey registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
              example:
                id: pk_02HQX5
                label: My iPhone
                createdAt: '2026-05-17T10:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/passkeys/{passkeyId}:
    parameters:
      - in: path
        name: passkeyId
        required: true
        schema:
          type: string
    patch:
      operationId: authPasskeysRename
      summary: Rename a passkey.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasskeyRenameRequest'
            example:
              label: Work laptop
      responses:
        '200':
          description: Passkey updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
              example:
                id: pk_01HQX5
                label: Work laptop
                createdAt: '2026-05-17T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: authPasskeysRevoke
      summary: Revoke a passkey.
      tags:
        - auth
      responses:
        '204':
          description: Passkey revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/auth/email-change:
    post:
      operationId: authEmailChangeRequest
      summary: Initiate an email-change flow (sends an OTP to the new address).
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailChangeRequest'
            example:
              newEmail: founder+new@example.com
      responses:
        '202':
          description: OTP queued to the new address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEmailChangeTicket'
              example:
                ticketId: ec_01HQX5
                expiresAt: '2026-05-17T10:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/auth/email-change/verify-new:
    post:
      operationId: authEmailChangeVerifyNew
      summary: Submit the OTP delivered to the new address.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailChangeVerifyRequest'
            example:
              ticketId: ec_01HQX5
              code: '581204'
      responses:
        '200':
          description: New address proven; await confirmation on the old address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEmailChangeTicket'
              example:
                ticketId: ec_01HQX5
                expiresAt: '2026-05-17T10:25:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/email-change/confirm-old:
    post:
      operationId: authEmailChangeConfirmOld
      summary: Submit the OTP delivered to the old address to finalize the change.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailChangeVerifyRequest'
            example:
              ticketId: ec_01HQX5
              code: '903117'
      responses:
        '200':
          description: Email change applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: usr_01HQX5
                email: founder+new@example.com
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/users/me:
    get:
      operationId: usersMeGet
      summary: Get the current user.
      tags:
        - users
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: usr_01HQX5
                email: founder@example.com
                displayName: Founder
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: usersMeUpdate
      summary: Update the current user's profile.
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            example:
              displayName: Acme Founder
              locale: en-US
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: usr_01HQX5
                email: founder@example.com
                displayName: Acme Founder
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/users/me/devices:
    get:
      operationId: usersDevicesList
      summary: List active devices the user has authenticated on.
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Device list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDevicePage'
              example:
                data:
                  - id: dev_01HQX5
                    label: Chrome / macOS
                    lastSeenAt: '2026-05-17T09:50:00Z'
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/users/me/devices/{deviceId}:
    parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
    delete:
      operationId: usersDevicesRevoke
      summary: Revoke a device (forces re-auth from that device).
      tags:
        - users
      responses:
        '204':
          description: Device revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/users/me/exports:
    post:
      operationId: usersExportRequest
      summary: Request a personal-data export.
      tags:
        - users
      responses:
        '202':
          description: Export job created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExportJob'
              example:
                id: exp_01HQX5
                status: queued
                requestedAt: '2026-05-17T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/users/me/exports/{exportId}:
    parameters:
      - in: path
        name: exportId
        required: true
        schema:
          type: string
    get:
      operationId: usersExportGet
      summary: Poll export job status; returns signed URL when ready.
      tags:
        - users
      responses:
        '200':
          description: Export status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExportJob'
              example:
                id: exp_01HQX5
                status: ready
                downloadUrl: https://uploads.blockchain0x.com/exports/...
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/users/me/deletion:
    post:
      operationId: usersDeleteRequest
      summary: Request soft-delete (enters 30-day grace).
      tags:
        - users
      responses:
        '202':
          description: Deletion scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeletionTicket'
              example:
                status: pending
                executesAt: '2026-06-16T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: usersDeleteCancel
      summary: Cancel a pending deletion during the grace window.
      tags:
        - users
      responses:
        '200':
          description: Deletion cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeletionTicket'
              example:
                status: cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/workspaces:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
    get:
      operationId: workspacesList
      summary: List workspaces the current user belongs to.
      tags:
        - workspaces
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Workspace list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
              example:
                data:
                  - id: ws_01HQX5
                    slug: acme
                    name: Acme
                    network: mainnet
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: workspacesCreate
      summary: Create a new workspace.
      tags:
        - workspaces
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
            example:
              slug: acme
              name: Acme
      responses:
        '201':
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: ws_01HQX5
                slug: acme
                name: Acme
                network: mainnet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
    get:
      operationId: workspacesGet
      summary: Get a workspace.
      tags:
        - workspaces
      responses:
        '200':
          description: Workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: ws_01HQX5
                slug: acme
                name: Acme
                network: mainnet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: workspacesUpdate
      summary: Update a workspace.
      tags:
        - workspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
            example:
              name: Acme Holdings
      responses:
        '200':
          description: Workspace updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: ws_01HQX5
                slug: acme
                name: Acme Holdings
                network: mainnet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
    get:
      operationId: workspacesMembersList
      summary: List members of a workspace.
      tags:
        - workspaces
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Member list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberPage'
              example:
                data:
                  - id: wsm_01HQX5
                    userId: usr_01HQX5
                    role: owner
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: workspacesMembersAdd
      summary: Add a member to a workspace.
      tags:
        - workspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberCreate'
            example:
              userId: usr_02HQX5
              role: admin
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
              example:
                id: wsm_02HQX5
                userId: usr_02HQX5
                role: admin
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/workspaces/{workspaceId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
      - in: path
        name: memberId
        required: true
        schema:
          type: string
    patch:
      operationId: workspacesMembersUpdate
      summary: Update a member's role.
      tags:
        - workspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberUpdate'
            example:
              role: admin
      responses:
        '200':
          description: Member updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
              example:
                id: wsm_02HQX5
                userId: usr_02HQX5
                role: admin
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: workspacesMembersRemove
      summary: Remove a member.
      tags:
        - workspaces
      responses:
        '204':
