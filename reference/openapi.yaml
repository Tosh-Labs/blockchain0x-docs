            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
              example:
                data:
                  - id: ak_01HQX5
                    prefix: sk_test_abc
                    scopes:
                      - payments:write
                    createdAt: '2026-05-17T10:00:00Z'
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
