  /v1/workspaces/{workspaceId}/export:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
    post:
      operationId: workspacesExportRequest
      summary: Request a one-shot workspace data export.
      description: |
        Owner-only. Enqueues a `workspace_exports` row, fans out a
        `workspace.export.requested` notification, and returns 202
        with the export id so the caller can poll
        `GET /v1/workspaces/{id}/exports/{exportId}` for status. The
        worker picks up the row, builds a JSON artifact (workspace,
        agents, transactions, audit log), stamps a signed download
        URL with a 24h TTL, and emits `workspace.export.ready`.
        Idempotent within a 5-minute window for the same caller
        (returns the existing row with `duplicate: true`).
      tags:
        - workspaces
      x-blockchain0x-examples-exempt: true
      responses:
        '202':
          description: Export queued (or duplicate within the idempotency window).
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                  - requestedAt
                  - duplicate
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - requested
                      - building
                      - ready
                  requestedAt:
                    type: string
                    format: date-time
                  duplicate:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{workspaceId}/exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
      - in: path
        name: exportId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: workspacesExportStatus
      summary: Poll the status of a workspace export.
      tags:
        - workspaces
      responses:
        '200':
          description: Export status.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                  - requestedAt
                  - requestedByYou
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - requested
                      - building
                      - ready
                      - failed
                  requestedAt:
                    type: string
                    format: date-time
                  readyAt:
                    type: string
                    format: date-time
                    nullable: true
                  byteSize:
                    type: integer
                    nullable: true
                  downloadUrl:
                    type: string
                    nullable: true
                  downloadUrlExpiresAt:
                    type: string
                    format: date-time
                    nullable: true
                  failureReason:
                    type: string
                    nullable: true
                  requestedByYou:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
