      - in: path
        name: apiKeyId
        required: true
        schema:
          type: string
    post:
      operationId: apiKeysRotate
      summary: Rotate an API key (7-day overlap window).
      tags:
        - api-keys
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '201':
          description: New API key minted; predecessor remains valid for 7 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyRotation'
              example:
                predecessor:
                  id: ak_01HQX5
                successor:
                  id: ak_02HQX5
                  secret: sk_test_xyz...
                overlapEndsAt: '2026-05-24T10:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
