  /v1/agents/{agentId}/verifications:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    get:
      operationId: agentsVerificationsList
      summary: List the wallet's verification methods + statuses.
      description: |
        Sub-plan 16.5.B10: returns exactly email/github/sms (domain is never
        offered). email is verified by definition; github reflects
        agent_wallets.github_verification; sms is verified when the user has a
        verified phone. Requires Viewer+ on the wallet.
      tags:
        - agents
      responses:
        '200':
          description: Verification methods + statuses.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletVerificationMethod'
              example:
                data:
                  - method: email
                    status: verified
                    target: dev@example.com
                  - method: github
                    status: not_started
                    target: null
                  - method: sms
                    status: verified
                    target: +1•••••4567
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: agentsVerificationsCreate
      summary: Start a verification (email, github, sms).
      description: |
        Sub-plan 16.5.B10: reports the method's current state and, for sms,
        points at the dedicated OTP flow (B11). domain is rejected. Developer+.
      tags:
        - agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
              additionalProperties: false
              properties:
                method:
                  type: string
                  enum:
                    - email
                    - github
                    - sms
            example:
              method: sms
      responses:
        '200':
          description: Current verification state for the requested method.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WalletVerificationMethod'
                  - type: object
                    properties:
                      next:
                        type:
                          - string
                          - 'null'
              example:
                method: sms
                status: not_started
                target: null
                next: POST .../sms/start
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{agentId}/verifications/sms/start:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    post:
      operationId: agentsVerificationSmsStart
      summary: Send an SMS verification code (or report already-verified).
      description: >
        Sub-plan 16.5.B11: sends a Twilio Verify OTP to the user's phone. If the

        user already has a verified phone (16.3 account 2FA) this is a no-op
        that

        returns the verified state. Blocked in demo mode. Developer+.
      tags:
        - agents
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsVerificationStart'
            example:
              phone: '+15551234567'
      responses:
        '200':
          description: Already verified (no OTP sent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletVerificationMethod'
              example:
                method: sms
                status: verified
                target: +1•••••4567
        '202':
          description: OTP sent; awaiting check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletVerificationMethod'
              example:
                method: sms
                status: pending
                target: •••••4567
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{agentId}/verifications/sms/check:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    post:
      operationId: agentsVerificationSmsCheck
      summary: Verify an SMS code and persist the SMS verification.
      description: |
        Sub-plan 16.5.B11: checks the Twilio Verify code; on success writes a
        verifications row (type=sms, status=verified). A bad code returns 401
        verification.code_invalid. Blocked in demo mode. Developer+.
      tags:
        - agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsVerificationCheck'
            example:
              code: '123456'
              phone: '+15551234567'
      responses:
        '200':
          description: SMS verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletVerificationMethod'
              example:
                method: sms
                status: verified
                target: •••••4567
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/drafts/active:
    get:
      operationId: agentsDraftsGetActive
      summary: Get the authenticated user's active wizard draft (or null).
      description: |
        Returns `{ draft: AgentDraft }` when an active draft exists,
        or `{ draft: null }` when none does. Active = `completed_at IS NULL`.
      x-blockchain0x-network-exempt: true
      x-blockchain0x-examples-exempt: true
      tags:
        - agents
      responses:
        '200':
          description: Active draft, or null when none exists.
          content:
            application/json:
              schema:
                type: object
                required:
                  - draft
                additionalProperties: false
                properties:
                  draft:
                    oneOf:
                      - $ref: '#/components/schemas/AgentDraft'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: agentsDraftsUpsertActive
      summary: Upsert the authenticated user's active wizard draft.
      description: |
        Idempotent upsert. Creates the active draft if none exists,
        then advances `currentStep` (when `step` is provided) and
        merges `state` (top-level JSONB merge - nested objects are
        replaced, not deeply merged). Forward step jumps of more than
        one are rejected with `onboarding.invalid_transition`.
      x-blockchain0x-network-exempt: true
      x-blockchain0x-examples-exempt: true
      tags:
        - agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDraftUpdate'
            example:
              step: plan
              state:
                selectedPlan: pro
      responses:
        '200':
          description: Draft created or updated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - draft
                additionalProperties: false
                properties:
                  draft:
                    $ref: '#/components/schemas/AgentDraft'
        '400':
          description: Invalid step transition or bad body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: agentsDraftsDiscardActive
      summary: Discard the authenticated user's active wizard draft.
      description: |
        Hard-deletes the active draft row so the user can start
        fresh. Idempotent - returns 204 whether or not a draft was
        present.
      x-blockchain0x-network-exempt: true
      x-blockchain0x-examples-exempt: true
      tags:
        - agents
      responses:
        '204':
          description: Draft discarded (or no active draft existed).
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/transactions/export:
