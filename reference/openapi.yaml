        schema:
          type: string
    get:
      operationId: agentsTeam
      summary: List the members with access to this wallet.
      description: |
        Sub-plan 16.5.B14: the wallet detail Team-tab roster - Owner/Admin (who
        implicitly have access) plus members with an active grant covering this
        wallet. Replaces the legacy /internal/agents/{id}/collaborators call.
        Requires Viewer+ on the wallet; balances are never exposed.
      tags:
        - agents
      responses:
        '200':
          description: Wallet team roster.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletMemberRow'
              example:
                data:
                  - memberId: mem_01
                    displayName: Ada
                    email: ada@x.com
                    workspaceRole: Owner
                    walletRole: null
                    grantScope: null
                  - memberId: mem_02
                    displayName: Dev
                    email: dev@x.com
                    workspaceRole: Developer
                    walletRole: Developer
                    grantScope: wallet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{agentId}/payment-requests:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    post:
      operationId: agentsPaymentRequestCreate
      summary: Create a shareable payment request bound to this wallet.
      description: >
        Agent-scoped "Create payment request" quick action (sub-plan 16.5.B4).

        Pre-binds the agent from the path, requires Developer+ on the wallet,
        and

        returns a shareable hosted URL. `amountUsdc` is optional (open amount
        when

        omitted). Demo mode returns a sandbox URL and writes nothing. The

        workspace-wide surface stays at POST /v1/payment-requests.
      tags:
        - agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                amountUsdc:
                  type: string
                  pattern: ^[0-9]+(\.[0-9]{1,6})?$
                memo:
                  type: string
                  maxLength: 280
            example:
              amountUsdc: '12.50'
              memo: invoice 42
      responses:
        '201':
          description: Payment request created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - url
                additionalProperties: false
                properties:
                  id:
                    type: string
                  url:
                    type: string
                    format: uri
                  amountUsdc:
                    type: string
                    pattern: ^[0-9]+(\.[0-9]{1,6})?$
                  memo:
                    type: string
              example:
                id: pr_01HQX5
                url: https://wallet.blockchain0x.com/pay/tok_abc
                amountUsdc: '12.50'
                memo: invoice 42
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{agentId}/withdrawals/quote:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    post:
      operationId: agentsWithdrawalQuote
      summary: Quote a USDC withdrawal and preview the step-up gate.
      description: >
        Validates the recipient (shape, self-send, B0X infra denylist), confirms

        the wallet holds enough USDC, and previews which auth factors the
        execute

        call will require (sub-plan 16.5.B2). Passkey + email OTP are always

        required; one additional enrolled 2FA factor is required when the amount

        exceeds the stricter of the 500-USDC product floor and the caller's

        per-user large-withdrawal threshold. Requires Admin on the wallet.
      tags:
        - agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalInitiate'
            example:
              toAddress: '0x2222222222222222222222222222222222222222'
              amountUsdc: '125.50'
      responses:
        '200':
          description: Withdrawal quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalQuote'
              example:
                netUsdc: '125.5'
                gasEstimateUsdc: '0.01'
                requiresStepUp: false
                requiredFactors:
                  - passkey
                  - email_otp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/agents/{agentId}/withdrawals:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    post:
      operationId: agentsWithdrawalExecute
      summary: Execute a USDC withdrawal (step-up gated).
      description: >
        Verifies the auth factors (passkey + email OTP always; one additional

        enrolled 2FA factor for amounts over the step-up threshold), then builds

        and submits the USDC-transfer userop and records the outbound
        transaction

        (sub-plan 16.5.B3). Requires Admin on the wallet. Blocked with 403

        demo.action_blocked in demo mode. A missing factor returns 422

        WithdrawalStepUpRequired with the discriminated factor list.
      tags:
        - agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalInitiate'
            example:
              toAddress: '0x2222222222222222222222222222222222222222'
              amountUsdc: '125.50'
              emailOtp: '123456'
      responses:
        '200':
          description: Withdrawal submitted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - txHash
                  - transactionId
                additionalProperties: false
                properties:
                  txHash:
                    type: string
                  transactionId:
                    type: string
              example:
                txHash: '0xdeadbeef'
                transactionId: txn_01HQX5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Missing step-up factor(s) or insufficient balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalStepUpRequired'
              example:
                code: withdrawal.requires_step_up
                factors:
                  - passkey
                  - email_otp
                  - totp
                satisfied:
                  - passkey
                  - email_otp
                enrolledExtraFactors:
                  - totp
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/agents/{agentId}/spend-permissions/summary:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    get:
      operationId: agentsSpendPermissionSummary
      summary: Rolled-up summary of the wallet's active spend permission.
      description: |
        Sub-plan 16.5.B7: the single active permission rolled up to
        cap/used/remaining/perTx/expiresAt/status for the Permissions tab card.
        `used` is the sum of confirmed outbound USDC within the active window;
        `status` is none when the wallet has no permission. Requires Viewer+ on
        the wallet.
      tags:
        - agents
      responses:
        '200':
          description: Spend permission summary (status=none when there is none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendPermissionSummary'
              example:
                status: active
                capUsdc: '500'
                usedUsdc: '120.5'
                remainingUsdc: '379.5'
                perTxUsdc: null
                period: day
                expiresAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{agentId}/spend-permissions:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    get:
