openapi: 3.1.0
info:
  title: Blockchain0x Public API
  summary: Non-custodial agent-wallet REST surface (workspace + agent + payments).
  description: >
    Public REST API that backs `wallet.blockchain0x.com` and every Blockchain0x

    SDK. Authoritative resource catalog lives in

    [docs/plan/05-api-design.md](https://github.com/toshlabs-repos/blockchain0x-app/blob/dev/docs/plan/05-api-design.md);

    this document is the wire-format contract.


    All workspace-scoped operations require the `X-Network` header (mainnet or

    testnet) per sub-plan 04.5. Mutations accept `Idempotency-Key` per

    sub-plan 05. Errors follow the canonical envelope shape (see the

    `ErrorEnvelope` component).
  version: 0.0.1
  contact:
    name: Blockchain0x Developer Support
    email: developers@blockchain0x.com
    url: https://docs.blockchain0x.com
  license:
    name: Proprietary
    url: https://blockchain0x.com/terms
  termsOfService: https://blockchain0x.com/terms
servers:
  - url: http://localhost:3001
    description: Local dev (compose:up:local)
  - url: https://dev-api.blockchain0x.com
    description: Development (shared dev environment)
  - url: https://staging-api.blockchain0x.com
    description: Staging (production-shaped)
  - url: https://api.blockchain0x.com
    description: Production
tags:
  - name: auth
    description: Email-OTP + passkey authentication, sessions, email change.
  - name: users
    description: Current user profile, devices, data export, deletion.
  - name: workspaces
    description: Workspace, members, invites.
  - name: agents
    description: Agent CRUD, public agent page, spend permissions, verifications, drafts.
  - name: transactions
    description: Transaction history + broadcast of pre-signed transactions.
  - name: balances
    description: Per-agent + workspace balance rollups.
  - name: earnings
    description: Earnings rollups.
  - name: billing
    description: Plan, invoices, checkout (Stripe-backed).
  - name: referrals
    description: Referral codes + payouts.
  - name: security
    description: Active sessions + MFA settings.
  - name: api-keys
    description: API key lifecycle (create, rotate, revoke).
  - name: webhooks
    description: Outbound webhook endpoints + delivery log + test fires.
  - name: pay
    description: Hosted `/pay` autonomous-payment sessions.
  - name: status
    description: Public status snapshot.
  - name: audit-log
    description: Workspace-scoped audit feed.
  - name: payment-requests
    description: Hosted payment requests (unauth one-fetch supported).
  - name: payments
    description: Outflow endpoint (Idempotency-Key mandatory).
  - name: uploads
    description: Signed-URL upload sign + confirm + read.
  - name: chains
    description: Public chain list + per-chain config.
  - name: metadata
    description: Public reference catalog (countries, states, timezones).
security:
  - bearerAuth: []
  - cookieAuth: []
  - apiKeyAuth: []
paths:
  /v1/auth/otp/send:
    post:
      operationId: authOtpSend
      summary: Request an email OTP.
      description: |
        Queues a one-time code to the supplied email. Always returns 202 so
        callers cannot probe for account existence.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthOtpSendRequest'
            example:
              email: founder@example.com
              intent: signup
      responses:
        '202':
          description: OTP queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOtpSendResponse'
              example:
                requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
                expiresInSeconds: 600
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/auth/otp/verify:
    post:
      operationId: authOtpVerify
      summary: Verify an email OTP and exchange for a session.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthOtpVerifyRequest'
            example:
              email: founder@example.com
              code: '847291'
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                accessToken: eyJhbGciOiJFUzI1NiJ9...
                refreshToken: rt_01HQX5NXY2P3W2YGJ8ZQK5V4G6
                user:
                  id: usr_01HQX5
                  email: founder@example.com
                expiresIn: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/passkey/register/options:
    post:
      operationId: authPasskeyRegisterOptions
      summary: Get WebAuthn registration challenge options.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasskeyRegisterOptionsRequest'
            example:
              displayName: My MacBook
      responses:
        '200':
          description: Options issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnRegisterOptions'
              example:
                challenge: ZGVtby1jaGFsbGVuZ2U
                rp:
                  id: blockchain0x.com
                  name: Blockchain0x
                user:
                  id: usr_01HQX5
                  name: founder@example.com
                  displayName: Founder
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/passkey/register/verify:
    post:
      operationId: authPasskeyRegisterVerify
      summary: Verify a WebAuthn registration response.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasskeyRegisterVerifyRequest'
            example:
              credential:
                id: ZGVtby1jcmVk
                response:
                  clientDataJSON: ...
                  attestationObject: ...
      responses:
        '201':
          description: Passkey registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
              example:
                id: pk_01HQX5
                label: My MacBook
                createdAt: '2026-05-17T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/passkey/assert/options:
    post:
      operationId: authPasskeyAssertOptions
      summary: Get WebAuthn assertion challenge options.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasskeyAssertOptionsRequest'
            example:
              email: founder@example.com
      responses:
        '200':
          description: Options issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnAssertOptions'
              example:
                challenge: ZGVtby1jaGFsbGVuZ2U
                allowCredentials:
                  - id: ZGVtby1jcmVk
                    type: public-key
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/passkey/assert/verify:
    post:
      operationId: authPasskeyAssertVerify
      summary: Verify a WebAuthn assertion and exchange for a session.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasskeyAssertVerifyRequest'
            example:
              credential:
                id: ZGVtby1jcmVk
                response:
                  clientDataJSON: ...
                  authenticatorData: ...
                  signature: ...
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                accessToken: eyJhbGciOiJFUzI1NiJ9...
                refreshToken: rt_01HQX5
                expiresIn: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/session:
    get:
      operationId: authSessionGet
      summary: Get the current session + user.
      tags:
        - auth
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                accessToken: eyJ...
                user:
                  id: usr_01HQX5
                  email: founder@example.com
                expiresIn: 740
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: authSessionRefresh
      summary: Rotate the refresh token and mint a new access token.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSessionRefreshRequest'
            example:
              refreshToken: rt_01HQX5NXY2P3W2YGJ8ZQK5V4G6
      responses:
        '200':
          description: New session issued; previous refresh token revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                accessToken: eyJ...
                refreshToken: rt_01HQX5NEW
                expiresIn: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: authSessionRevoke
      summary: Revoke the current session (log out).
      tags:
        - auth
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/passkeys:
    get:
      operationId: authPasskeysList
      summary: List the current user's registered passkeys.
      tags:
        - auth
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Passkey list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyPage'
              example:
                data:
                  - id: pk_01HQX5
                    label: My MacBook
                    createdAt: '2026-05-17T10:00:00Z'
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: authPasskeysCreate
      summary: >-
        Register a new passkey (server-driven flow alias for
        /v1/auth/passkey/register/verify).
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasskeyRegisterVerifyRequest'
            example:
              credential:
                id: ZGVtby1jcmVk
                response:
                  clientDataJSON: ...
                  attestationObject: ...
              label: My iPhone
      responses:
        '201':
          description: Passkey registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
              example:
                id: pk_02HQX5
                label: My iPhone
                createdAt: '2026-05-17T10:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/passkeys/{passkeyId}:
    parameters:
      - in: path
        name: passkeyId
        required: true
        schema:
          type: string
    patch:
      operationId: authPasskeysRename
      summary: Rename a passkey.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasskeyRenameRequest'
            example:
              label: Work laptop
      responses:
        '200':
          description: Passkey updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
              example:
                id: pk_01HQX5
                label: Work laptop
                createdAt: '2026-05-17T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: authPasskeysRevoke
      summary: Revoke a passkey.
      tags:
        - auth
      responses:
        '204':
          description: Passkey revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/users/me:
    get:
      operationId: usersMeGet
      summary: Get the current user.
      tags:
        - users
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: usr_01HQX5
                email: founder@example.com
                displayName: Founder
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: usersMeUpdate
      summary: Update the current user's profile.
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            example:
              displayName: Acme Founder
              locale: en-US
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: usr_01HQX5
                email: founder@example.com
                displayName: Acme Founder
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/users/me/devices:
    get:
      operationId: usersDevicesList
      summary: List active devices the user has authenticated on.
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Device list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDevicePage'
              example:
                data:
                  - id: dev_01HQX5
                    label: Chrome / macOS
                    lastSeenAt: '2026-05-17T09:50:00Z'
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/users/me/devices/{deviceId}:
    parameters:
      - in: path
        name: deviceId
        required: true
        schema:
          type: string
    delete:
      operationId: usersDevicesRevoke
      summary: Revoke a device (forces re-auth from that device).
      tags:
        - users
      responses:
        '204':
          description: Device revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/users/me/exports:
    post:
      operationId: usersExportRequest
      summary: Request a personal-data export.
      tags:
        - users
      responses:
        '202':
          description: Export job created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExportJob'
              example:
                id: exp_01HQX5
                status: queued
                requestedAt: '2026-05-17T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/users/me/exports/{exportId}:
    parameters:
      - in: path
        name: exportId
        required: true
        schema:
          type: string
    get:
      operationId: usersExportGet
      summary: Poll export job status; returns signed URL when ready.
      tags:
        - users
      responses:
        '200':
          description: Export status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExportJob'
              example:
                id: exp_01HQX5
                status: ready
                downloadUrl: https://uploads.blockchain0x.com/exports/...
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/users/me/deletion:
    post:
      operationId: usersDeleteRequest
      summary: Request soft-delete (enters 30-day grace).
      tags:
        - users
      responses:
        '202':
          description: Deletion scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeletionTicket'
              example:
                status: pending
                executesAt: '2026-06-16T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: usersDeleteCancel
      summary: Cancel a pending deletion during the grace window.
      tags:
        - users
      responses:
        '200':
          description: Deletion cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeletionTicket'
              example:
                status: cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/workspaces/invites/accept:
    post:
      operationId: workspacesInvitesAccept
      summary: Accept a workspace invite via its token.
      description: |
        Public endpoint (token-gated). Looks up the invite by the
        sha256 of the supplied token, validates it is not revoked or
        expired, and requires the caller to be signed in with the
        invited email. On success, inserts a `workspace_members` row
        and stamps `workspace_invites.accepted_at` in a single
        transaction. Idempotent on replay for the same accepter.
      tags:
        - workspaces
      x-blockchain0x-network-exempt: true
      x-blockchain0x-examples-exempt: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 8
                  maxLength: 256
                  description: Raw invite token from the email's accept-link.
      responses:
        '200':
          description: Invite accepted (or idempotent replay).
          content:
            application/json:
              schema:
                type: object
                required:
                  - workspaceId
                  - role
                  - accepted
                  - replay
                properties:
                  workspaceId:
                    type: string
                    format: uuid
                  memberId:
                    type: string
                    nullable: true
                  role:
                    type: string
                    enum:
                      - owner
                      - admin
                      - developer
                      - viewer
                  accepted:
                    type: boolean
                  replay:
                    type: boolean
        '400':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Conflict'
  /v1/workspaces/invites/preview:
    get:
      operationId: workspacesInvitesPreview
      summary: Preview a pending invite by its token (least disclosure).
      description: >
        Sub-plan 16.4.C4. Public, token-gated, NOT workspace-scoped. Powers the
        accept-invite screen + the dashboard banner BEFORE acceptance. Returns
        only what the recipient is entitled to see (workspace name + logo,
        inviter display name, offered role + description, wallet-grant summary,
        masked invitee email). Never returns member rosters, wallet ids,
        balances, or other workspace data. Invalid tokens return the specific
        sentinel codes (invite.expired / invite.revoked / invite.already_used /
        invite.not_found).
      tags:
        - workspaces
      x-blockchain0x-network-exempt: true
      x-blockchain0x-examples-exempt: true
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 256
      responses:
        '200':
          description: Invite preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitePreview'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Conflict'
  /v1/me/invites:
    get:
      operationId: meInvitesList
      summary: List the current user's pending workspace invites.
      description: >
        Sub-plan 16.4.C6. Returns the PENDING invites whose email matches the
        authenticated user's verified email, across any workspace, for the
        dashboard banner. Least-disclosure per invite (same shape as the token
        preview, plus inviteId; no raw token). Email match is on the session
        user's email hash - never a client-supplied email.
      tags:
        - workspaces
      x-blockchain0x-network-exempt: true
      responses:
        '200':
          description: The caller's pending invites.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyInvite'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/invites/{inviteId}/accept:
    parameters:
      - in: path
        name: inviteId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: meInvitesAccept
      summary: Accept one of the current user's pending invites by id.
      description: >
        Sub-plan 16.4.C7. In-app (banner) accept path. Resolves the invite by
        id, confirms the caller is the recipient (email hash match) - otherwise
        404 (least disclosure) - then runs the same accept transaction as the
        token path (materializes wallet grants, marks accepted). Idempotent for
        the same accepter.
      tags:
        - workspaces
      x-blockchain0x-network-exempt: true
      responses:
        '200':
          description: Invite accepted (or idempotent replay).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - workspaceId
                  - role
                  - accepted
                  - replay
                properties:
                  workspaceId:
                    type: string
                    format: uuid
                  memberId:
                    type: string
                    nullable: true
                  role:
                    type: string
                    enum:
                      - owner
                      - admin
                      - developer
                      - viewer
                  accepted:
                    type: boolean
                  replay:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Conflict'
  /v1/workspaces:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
    get:
      operationId: workspacesList
      summary: List workspaces the current user belongs to.
      tags:
        - workspaces
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Workspace list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
              example:
                data:
                  - id: ws_01HQX5
                    slug: acme
                    name: Acme
                    network: mainnet
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: workspacesCreate
      summary: Create a new workspace.
      tags:
        - workspaces
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
            example:
              slug: acme
              name: Acme
      responses:
        '201':
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: ws_01HQX5
                slug: acme
                name: Acme
                network: mainnet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
    get:
      operationId: workspacesGet
      summary: Get a workspace.
      tags:
        - workspaces
      responses:
        '200':
          description: Workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: ws_01HQX5
                slug: acme
                name: Acme
                network: mainnet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: workspacesUpdate
      summary: Update a workspace.
      tags:
        - workspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
            example:
              name: Acme Holdings
      responses:
        '200':
          description: Workspace updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: ws_01HQX5
                slug: acme
                name: Acme Holdings
                network: mainnet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: workspacesDelete
      summary: Soft-delete a workspace.
      description: |
        Owner-only. Soft-deletes the workspace (stamps `deleted_at`),
        cascade-revokes its API keys, webhooks, and pending invites,
        and writes a `workspace.deleted` audit-log row. Refuses with
        409 `workspace.has_active_subscriptions` while any agent
        subscription is still active - cancel them first.
      tags:
        - workspaces
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Optional free-text reason recorded in the audit log.
      responses:
        '204':
          description: Workspace deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/workspaces/{workspaceId}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
    post:
      operationId: workspacesTransferOwnership
      summary: Transfer workspace ownership to another member.
      description: |
        Owner-only. Demotes the current owner to Admin and promotes
        the target user (who must already be a member) to Owner in a
        single transaction. Refuses with HTTP 409 when the target is
        the current owner or when a concurrent ownership change wins
        the partial-unique `(workspace_id) WHERE role='Owner'` index
        race. Emits a `workspace.owner_transferred` notification to
        both parties.
      tags:
        - workspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - toUserId
              properties:
                toUserId:
                  type: string
                  format: uuid
                  description: UUID of an existing member to promote to Owner.
      responses:
        '204':
          description: Ownership transferred.
        '400':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
