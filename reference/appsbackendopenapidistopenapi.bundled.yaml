components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived (<=15 min) asymmetric-JWT access token issued by the auth

        flow. See [05-api-design.md
        §Auth](https://github.com/toshlabs-repos/blockchain0x-app/blob/dev/docs/plan/05-api-design.md#auth).
    cookieAuth:
      type: apiKey
      in: cookie
      name: b0x_session
      description: |
        HttpOnly + SameSite=Lax cookie carrying the same access JWT as
        bearerAuth. Set by `POST /v1/auth/otp/verify`,
        `POST /v1/auth/passkey/assert/verify`, and `POST /v1/auth/session`.
        Cleared on `DELETE /v1/auth/session`. The paired `b0x_refresh`
        cookie is scoped to `Path=/v1/auth/session` so it never travels
        on unrelated calls (sub-plan 15.5 H-19).
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `Authorization: Bearer sk_(live|test)_*` API key issued from the
        dashboard. Per-key scopes are `workspace_id + agent_id + mode` at MVP;
        rotation has a 7-day overlap window. See sub-plan 05 §"API key
        lifecycle".
  parameters:
    XNetworkHeader:
      name: X-Network
      in: header
      required: true
      schema:
        type: string
        enum:
          - mainnet
          - testnet
      description: |
        Selects the network slice the request targets. Workspace-scoped
        responses are filtered to this network; chain-bound writes are
        stamped with it. Required on every non-admin workspace-scoped
        operation. See sub-plan 04.5.
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: |
        Opaque client-chosen key dedupes a state-changing request for 24 hours.
        Required on `POST /v1/payments`; optional on every other mutation. A
        replay with the same key and the same request hash returns the cached
        response; a replay with the same key but a different hash returns
        `409 idempotency.conflict`.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: |
        Opaque pagination cursor returned by the previous page (`page.next` or
        `page.prev`). Omit to fetch the first page.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Page size. Servers cap at 100.
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        pattern: ^[a-zA-Z_][a-zA-Z0-9_]*:(asc|desc)$
      description: |
        Sort spec in the form `<field>:<asc|desc>`. Allowed fields are listed
        per resource. Defaults are documented per endpoint.
    EarningsRange:
      name: range
      in: query
      required: false
      schema:
        type: string
        enum:
          - 7d
          - 30d
          - 90d
          - all
        default: 30d
      description: |
        Time window for the Earnings page Range picker (sub-plan 16.6.A1).
        Server resolves the window in UTC anchored on `now`; `all` removes
        the floor. If both `range` and explicit `from`/`to` are supplied,
        explicit values win.
    EarningsFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: |
        Inclusive lower bound (ISO-8601 UTC). When present, overrides `range`'s
        lower bound. Must be strictly less than `to` if both are supplied.
    EarningsTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: |
        Exclusive upper bound (ISO-8601 UTC). When present, overrides `range`'s
        upper bound. Defaults to server `now` when omitted.
  schemas:
    ErrorEnvelope:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required:
        - code
        - message
        - requestId
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            Stable dot-namespaced snake_case error code. Single source of truth
            is `packages/shared/src/types/errors.ts`. Never relied on for
            display copy; use `message` for that.
          example: request.invalid
        message:
          type: string
          description: Human-readable, English. Safe to log; never localized.
          example: Request body failed validation.
        requestId:
          type: string
          description: Per-request id; matches the `x-request-id` response header.
          example: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
        details:
          description: |
            Optional code-specific payload. Example shapes are documented per
            error code in sub-plan 05 §Errors.
    PageInfo:
      type: object
      required:
        - next
        - prev
      additionalProperties: false
      properties:
        next:
          type:
            - string
            - 'null'
          description: Opaque cursor for the next page, or null at the end.
        prev:
          type:
            - string
            - 'null'
          description: Opaque cursor for the previous page, or null at the start.
    Network:
      type: string
      enum:
        - mainnet
        - testnet
      description: |
        Network slice. Carried on every chain-bound response (`Workspace`,
        `AgentWallet`, `Transaction`, `Payment`, `SpendPermission`,
        `EarningsRollup`, `BillingLedgerEntry`, `WebhookDelivery`). See
        sub-plan 04.5.
    AuthOtpSendRequest:
      type: object
      required:
        - email
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        intent:
          type: string
          enum:
            - signup
            - signin
          default: signin
    AuthOtpSendResponse:
      type: object
      required:
        - requestId
        - expiresInSeconds
      additionalProperties: false
      properties:
        requestId:
          type: string
        expiresInSeconds:
          type: integer
          minimum: 1
    AuthOtpVerifyRequest:
      type: object
      required:
        - email
        - code
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: ^[0-9]{6}$
    AuthSessionRefreshRequest:
      type: object
      required:
        - refreshToken
      additionalProperties: false
      properties:
        refreshToken:
          type: string
    AuthPasskeyRegisterOptionsRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          maxLength: 80
    AuthPasskeyRegisterVerifyRequest:
      type: object
      required:
        - credential
      additionalProperties: false
      properties:
        credential:
          type: object
          required:
            - id
            - response
          additionalProperties: true
          properties:
            id:
              type: string
            response:
              type: object
              additionalProperties: true
        label:
          type: string
          maxLength: 80
    AuthPasskeyAssertOptionsRequest:
      type: object
      required:
        - email
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
    AuthPasskeyAssertVerifyRequest:
      type: object
      required:
        - credential
      additionalProperties: false
      properties:
        credential:
          type: object
          required:
            - id
            - response
          additionalProperties: true
          properties:
            id:
              type: string
            response:
              type: object
              additionalProperties: true
    AuthPasskeyRenameRequest:
      type: object
      required:
        - label
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
    WebAuthnRegisterOptions:
      type: object
      additionalProperties: true
      description: |
        WebAuthn registration-options payload (the spec's
        `PublicKey Credential Creation Options` object, relayed verbatim).
      properties:
        challenge:
          type: string
          description: Base64url.
        rp:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
            name:
              type: string
        user:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
            name:
              type: string
            displayName:
              type: string
    WebAuthnAssertOptions:
      type: object
      additionalProperties: true
      description: |
        WebAuthn assertion-options payload (the spec's
        `PublicKey Credential Request Options` object, relayed verbatim).
      properties:
        challenge:
          type: string
        allowCredentials:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
              type:
                type: string
    Session:
      type: object
      required:
        - accessToken
        - expiresIn
      additionalProperties: false
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access-token TTL in seconds.
        user:
          $ref: '#/components/schemas/User'
    Passkey:
      type: object
      required:
        - id
        - label
        - createdAt
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
    PasskeyPage:
      type: object
      required:
        - data
        - page
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Passkey'
        page:
          $ref: '#/components/schemas/PageInfo'
    User:
      type: object
      required:
        - id
        - email
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type:
            - string
            - 'null'
        locale:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          maxLength: 80
        locale:
          type: string
          pattern: ^[a-z]{2}(-[A-Z]{2})?$
    UserDevice:
      type: object
      required:
        - id
        - label
        - lastSeenAt
      additionalProperties: false
      properties:
        id:
          type: string
        label:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        ipPrefix:
          type:
            - string
            - 'null'
        userAgent:
          type:
            - string
            - 'null'
    UserDevicePage:
      type: object
      required:
        - data
        - page
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserDevice'
        page:
          $ref: '#/components/schemas/PageInfo'
    UserExportJob:
      type: object
      required:
        - id
        - status
        - requestedAt
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - queued
            - building
            - ready
            - failed
            - expired
        requestedAt:
          type: string
          format: date-time
        downloadUrl:
          type:
            - string
            - 'null'
          format: uri
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
    UserDeletionTicket:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - pending
            - cancelled
            - completed
        executesAt:
          type:
            - string
            - 'null'
          format: date-time
    Workspace:
      type: object
      required:
        - id
        - slug
        - name
        - network
        - createdAt
      additionalProperties: false
      description: |
        Workspace metadata. The four `deletion*` fields are present on
        every workspace and read-only - they only flip via the
        owner-initiated soft-delete flow at POST/DELETE
        `/v1/workspaces/{id}/deletion` (sub-plan 16.9). When the
        workspace is `active` they are all `null`; when in
        `pending_deletion` `deletionPendingAt` and `deletionFinalizesAt`
        are both set, the optional `deletionRequestedBy` /
        `deletionReason` carry the owner's intent.
      properties:
        id:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$
        name:
          type: string
          maxLength: 80
        network:
          $ref: '#/components/schemas/Network'
        networkModeExplicit:
          type: boolean
        defaultChainId:
          type:
            - string
            - 'null'
        logoUrl:
          type:
            - string
            - 'null'
        timezone:
          type:
            - string
            - 'null'
        billingContactEmail:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        deletionPendingAt:
          type:
            - string
            - 'null'
          format: date-time
          description: NOW() the owner initiated soft-delete; null when active.
        deletionFinalizesAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            Derived: `deletionPendingAt + WORKSPACE_DELETION_GRACE_DAYS`.
            The countdown UI + worker finalizer both key off this value.
            Null when the workspace is active.
        deletionRequestedBy:
          type:
            - string
            - 'null'
          description: User UUID that initiated the pending deletion; null when active.
        deletionReason:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Optional free-text rationale typed by the owner; null when active.
    WorkspaceCreate:
      type: object
      required:
        - slug
