                name: Acme
                network: mainnet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: workspacesUpdate
      summary: Update a workspace.
      description: |
        Sub-plan 21.3 row A-4: workspace-flavor API keys with the
        `manage_workspace_metadata` scope can edit the public-copy fields
        (description, tagline, brandColor, seoTitle, seoDescription,
        seoKeywords, socialLinks). Identity fields (name, slug,
        networkMode) are silently stripped from API-key inputs - dashboard
        callers retain full edit rights subject to their workspace role.
      tags:
        - workspaces
      x-blockchain0x-apikey:
        mode: allow
        workspaceScope: manage_workspace_metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
            example:
              description: Treasury & operations workspace.
      responses:
        '200':
          description: Workspace updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                id: ws_01HQX5
                slug: acme
                name: Acme Holdings
                network: mainnet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: workspacesDelete
      summary: Soft-delete a workspace.
      description: |
        Owner-only. Soft-deletes the workspace (stamps `deleted_at`),
        cascade-revokes its API keys, webhooks, and pending invites,
        and writes a `workspace.deleted` audit-log row. Refuses with
        409 `workspace.has_active_subscriptions` while any agent
        subscription is still active - cancel them first.
      tags:
        - workspaces
      x-blockchain0x-apikey:
        mode: block
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Optional free-text reason recorded in the audit log.
      responses:
        '204':
          description: Workspace deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/workspaces/{workspaceId}/deletion:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
    post:
      operationId: workspacesDeletionInitiate
      summary: Initiate workspace soft-delete (owner-only).
      description: |
        Owner-only. Stamps `deletion_pending_at = NOW()` and returns 202
        with the updated workspace. Refuses with 409
        `workspace.deletion.already_pending` when a deletion is already
        pending, 409 `workspace.has_active_subscriptions` when an agent
        subscription is still active, and 409 `workspace.has_balance`
        (body lists offending wallets) when any wallet still holds USDC.
        Emits a `workspace.deletion.initiated` audit-log row and fans
        out the matching email to owner + admins.
      tags:
        - workspaces
      x-blockchain0x-apikey:
        mode: block
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type:
                    - string
                    - 'null'
                  maxLength: 500
                  description: Optional free-text rationale recorded in the audit log.
      responses:
        '202':
          description: Soft-delete initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: workspacesDeletionRevoke
      summary: Revoke a pending workspace deletion (owner-only).
      description: |
        Owner-only. Clears `deletion_pending_at`, sets
        `deletion_revoked_at = NOW()`, and returns 200 with the updated
        workspace. Refuses with 409 `workspace.deletion.not_pending`
        when no deletion is pending (or one has already finalized).
        Emits a `workspace.deletion.revoked` audit-log row and fans out
        the matching email to owner + admins. The owner is the ONLY
        member who can call this - the lockdown guard blocks every
        other mutation while pending.
      tags:
        - workspaces
      x-blockchain0x-apikey:
        mode: block
      responses:
        '200':
          description: Pending deletion revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: workspacesDeletionStatus
      summary: Read workspace soft-delete state.
      description: |
        Any workspace member can read. Returns the canonical state
        shape (active / pending_deletion / finalized) plus the metadata
        the lockdown screen + countdown banner need to render. This is
        the ONE workspace-bound read non-owners are still allowed to
        make while the workspace is pending; the rest of the surface
        returns 410 `workspace.pending_deletion`.
      tags:
        - workspaces
      x-blockchain0x-apikey:
        mode: block
      responses:
        '200':
          description: Workspace deletion state.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, max-age=30 - the web-app React Query refetch cadence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDeletionState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
