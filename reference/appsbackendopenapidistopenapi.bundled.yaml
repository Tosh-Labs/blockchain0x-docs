          pattern: ^[0-9]+$
        paymentCount:
          type: integer
          minimum: 0
        sharePct:
          type: string
          pattern: ^[0-9]+(\.[0-9])?$
          description: Percentage as a string, 1dp (e.g. "42.3").
        chainId:
          type: integer
        network:
          $ref: '#/components/schemas/Network'
