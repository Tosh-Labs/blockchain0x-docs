      additionalProperties: false
      properties:
        id:
          type: string
        token:
          type: string
        amountWei:
          type: string
          pattern: ^[0-9]+$
        status:
          type: string
          description: |
            Lifecycle states:
              - open: created, waiting for payment.
              - completed: hosted-checkout path landed an on-chain confirmation.
              - settled: sub-plan 21.2 row A-3 - x402 / SDK payer attested a
                txHash and the backend verified it against `transactions`.
              - expired / cancelled: terminal non-paying states.
          enum:
            - open
            - completed
            - settled
            - expired
            - cancelled
        url:
          type: string
          format: uri
        network:
          $ref: '#/components/schemas/Network'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
        settledTxHash:
          type:
            - string
            - 'null'
          description: |
            On-chain proof attached by the settle endpoint. Non-null only when
            `status = settled`.
        settledAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the backend verified the settlement.
    PaymentRequestPublic:
      type: object
      required:
        - token
        - amountWei
        - status
        - network
      additionalProperties: false
      properties:
        token:
          type: string
        amountWei:
          type: string
          pattern: ^[0-9]+$
        status:
          type: string
          enum:
            - open
            - completed
            - settled
            - expired
            - cancelled
        network:
          $ref: '#/components/schemas/Network'
        merchant:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            slug:
              type: string
    PaymentRequestSettleBody:
      type: object
      required:
        - txHash
        - payerAddress
        - amountUsdcVerified
      additionalProperties: false
      description: |
        Sub-plan 21.2 row A-3. The payer-side agent calls this endpoint
        after broadcasting payment to claim settlement. The backend MUST
        verify the tuple against `transactions` before marking the invoice
        settled - server is the trust anchor, agent is untrusted input.
      properties:
        txHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
          description: Hash of the on-chain transfer that paid the invoice.
        payerAddress:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          description: Address that sent funds. Must match `transactions.from_address`.
        amountUsdcVerified:
          type: string
          pattern: ^[0-9]+(?:\.[0-9]+)?$
          description: |
            USDC amount the payer claims they sent (human-readable, e.g.
            "0.10"). Backend converts to wei and rejects on mismatch.
    PaymentRequestPage:
      type: object
      required:
        - data
        - page
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRequest'
        page:
          $ref: '#/components/schemas/PageInfo'
    PaymentCreate:
