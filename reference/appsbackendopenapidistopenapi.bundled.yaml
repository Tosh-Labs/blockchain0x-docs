                $ref: '#/components/schemas/UploadSignResponse'
              example:
                id: upl_01HQX5
                uploadUrl: https://uploads.blockchain0x.com/...?signature=...
                expiresAt: '2026-05-17T10:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: uploadId
        required: true
        schema:
          type: string
    get:
      operationId: uploadsGet
