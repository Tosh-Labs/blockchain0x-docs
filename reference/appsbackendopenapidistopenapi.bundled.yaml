    EarningsKpiSummary:
      type: object
      description: |
        KPI block for the Earnings page hero + top-row stat cards (sub-plan
        16.6.A2). All USDC fields are decimal strings in 6dp base units so
        precision is preserved across the wire; the web-app formats them via
        the 16.6.A3 `usdcBaseUnitsToFloat` helper. `range` is the resolved
        window the server applied (echoes the request's `range`, or `'custom'`
        when explicit `from`/`to` won).
      required:
        - range
        - totalInboundUsdc
        - txCount
        - avgPaymentUsdc
        - lifetimeInboundUsdc
        - availableToWithdrawUsdc
        - referralEarningsUsdc
      additionalProperties: false
      properties:
        range:
          type: string
          enum:
            - 7d
            - 30d
            - 90d
            - all
            - custom
        totalInboundUsdc:
          type: string
          pattern: ^[0-9]+$
        txCount:
          type: integer
          minimum: 0
        avgPaymentUsdc:
          type: string
          pattern: ^[0-9]+$
        lifetimeInboundUsdc:
          type: string
          pattern: ^[0-9]+$
        availableToWithdrawUsdc:
          type: string
          pattern: ^[0-9]+$
        referralEarningsUsdc:
          type: string
          pattern: ^[0-9]+$
    EarningsTopAgent:
      type: object
      description: |
        One row of the Earnings page leaderboard (sub-plan 16.6.A2 / B4).
        `sharePct` is the percentage of the workspace's total inbound USDC
        contributed by this agent in the requested window, rounded to one
        decimal place (a string so the wire format never depends on the
        client's locale).
      required:
        - agentId
        - displayName
        - inboundUsdc
        - paymentCount
        - sharePct
        - chainId
        - network
      additionalProperties: false
      properties:
        agentId:
