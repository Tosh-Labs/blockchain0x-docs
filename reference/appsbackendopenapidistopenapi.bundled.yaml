    post:
      operationId: agentsWithdrawalOtpSend
      summary: Trigger a direct-send email OTP for the withdrawal flow.
      description: |
        Generates a fresh OTP, writes the hashed code to `email_otp_codes`,
        and emails it to the signed-in user via the same direct-send
        service `/v1/auth/otp/send` uses for sign-in codes. The execute
        step consumes the resulting row to clear the email-OTP factor.
      tags:
        - agents
