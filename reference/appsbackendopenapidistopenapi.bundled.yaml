    post:
      operationId: uploadsConfirm
      summary: Confirm an upload finished + trigger virus scan.
      tags:
        - uploads
      x-blockchain0x-apikey:
        mode: block
      responses:
        '200':
          description: Upload confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              example:
                id: upl_01HQX5
                status: scanning
                byteLength: 12345
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/chains:
    get:
      operationId: chainsList
      summary: List supported chains (chain-agnostic; no X-Network).
      tags:
        - chains
      x-blockchain0x-apikey:
        mode: allow
      security: []
