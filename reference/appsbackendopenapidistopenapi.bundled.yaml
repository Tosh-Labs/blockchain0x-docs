          type: string
          format: date-time
        method:
          type: string
          enum:
            - PUT
            - POST
          default: PUT
    Upload:
      type: object
      required:
        - id
        - status
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - pending
            - uploaded
            - scanning
            - confirmed
            - rejected
            - expired
        readUrl:
          type:
            - string
            - 'null'
          format: uri
        byteLength:
          type:
            - integer
            - 'null'
          minimum: 0
        contentType:
          type:
            - string
            - 'null'
        confirmedAt:
          type:
            - string
            - 'null'
          format: date-time
    Chain:
      type: object
      required:
        - id
        - name
        - parentChainId
        - network
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        parentChainId:
          type: integer
        network:
          $ref: '#/components/schemas/Network'
        rpcEndpoints:
          type: array
          items:
            type: string
            format: uri
        blockExplorerUrl:
          type:
            - string
            - 'null'
          format: uri
    ChainPage:
      type: object
      required:
        - data
        - page
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Chain'
        page:
          $ref: '#/components/schemas/PageInfo'
    Country:
      type: object
      required:
        - id
        - code
        - name
      additionalProperties: false
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        phoneCode:
          type:
            - string
            - 'null'
        currencySymbol:
          type:
            - string
            - 'null'
        capital:
          type:
            - string
            - 'null'
        currency:
          type:
            - string
            - 'null'
        continent:
          type:
            - string
            - 'null'
        continentCode:
          type:
            - string
            - 'null'
        alpha3:
          type:
            - string
            - 'null'
        flagIcon:
          type:
            - string
            - 'null'
    CountryList:
      type: object
      required:
        - data
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Country'
    State:
      type: object
      required:
        - id
        - name
        - countryId
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type:
            - string
            - 'null'
        countryId:
          type: integer
    StateList:
      type: object
      required:
        - data
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/State'
    Timezone:
      type: object
      required:
        - ianaName
        - label
        - utcOffset
        - region
      additionalProperties: false
      properties:
        ianaName:
          type: string
        label:
          type: string
        utcOffset:
          type: integer
        region:
          type: string
    TimezoneList:
      type: object
      required:
        - data
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Timezone'
    WithdrawalPrepareRequest:
      type: object
      required:
        - toAddress
        - amountUsdc
      additionalProperties: false
      properties:
        toAddress:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        amountUsdc:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
    WithdrawalPrepareResponse:
      type: object
      required:
        - userOpHash
        - smartAccount
        - network
        - netUsdc
        - feeUsdc
        - allowCredentials
      additionalProperties: false
      properties:
        userOpHash:
          description: 0x-prefixed userOpHash the browser must sign with the passkey.
          type: string
          pattern: ^0x[0-9a-fA-F]+$
        smartAccount:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        network:
          type: string
          enum:
            - mainnet
            - testnet
        netUsdc:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        feeUsdc:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        allowCredentials:
          description: |
            Credential IDs the browser should pass in `allowCredentials` so
            the WebAuthn prompt targets a known passkey (no username picker).
          type: array
          items:
            type: object
            required:
              - id
              - type
            additionalProperties: false
            properties:
              id:
                type: string
              type:
                type: string
                enum:
                  - public-key
    WithdrawalInitiate:
      type: object
      required:
        - userOpHash
        - signature
      additionalProperties: false
      properties:
        userOpHash:
          description: The userOpHash returned by /withdrawals/prepare.
          type: string
          pattern: ^0x[0-9a-fA-F]+$
        signature:
          type: object
          required:
            - signatureBytes
            - authenticatorData
            - clientDataJSON
          additionalProperties: false
          properties:
            signatureBytes:
              description: >-
                0x-prefixed 64-byte raw P-256 r||s (low-s normalised
                server-side).
              type: string
              pattern: ^0x[0-9a-fA-F]{128}$
            authenticatorData:
              description: Base64url-encoded raw authenticator data bytes.
              type: string
              minLength: 1
              maxLength: 4096
            clientDataJSON:
              description: Base64url-encoded raw clientDataJSON bytes.
              type: string
              minLength: 1
              maxLength: 4096
        emailOtp:
          type: string
          pattern: ^[0-9]{6}$
        remark:
          description: >-
            Optional user-facing accounting note for the withdrawal audit
            record.
          type: string
          minLength: 1
          maxLength: 280
        stepUpFactor:
          description: The additional factor satisfied for a large withdrawal.
          type: string
          enum:
            - totp
            - sms
            - hardware_key
        stepUpProof:
          description: >-
            Proof for `stepUpFactor` (TOTP code, SMS code, or WebAuthn
            assertion).
          type: object
          additionalProperties: true
    WithdrawalExecuteResult:
      type: object
      required:
        - transactionId
        - userOpHash
        - status
        - txHash
      additionalProperties: false
      properties:
        transactionId:
          type: string
        userOpHash:
          type: string
          pattern: ^0x[0-9a-fA-F]+$
        status:
          type: string
          enum:
            - submitted
        txHash:
          description: |
            Initially the userOpHash (the on-chain tx hash is not yet known
            because the bundler still has to mine the userOp). Poll
            /withdrawals/{transactionId}/receipt to back-fill the real tx hash
            once the userOp is mined.
          type: string
          pattern: ^0x[0-9a-fA-F]+$
    WithdrawalReceipt:
      type: object
      required:
        - status
        - txHash
        - blockNumber
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - pending
            - confirmed
            - failed
        txHash:
          description: On-chain tx hash once the userOp is mined; null until then.
          type:
            - string
            - 'null'
        blockNumber:
          type:
            - string
            - 'null'
    WithdrawalQuote:
      type: object
      required:
        - netUsdc
        - gasEstimateUsdc
        - requiresStepUp
        - requiredFactors
      additionalProperties: false
      properties:
        grossUsdc:
          description: |
            Total USDC leaving the smart account, equal to the amount
            the user typed. The recipient receives `netUsdc`; the B0X
            fee recipient receives `feeUsdc`. Both legs are batched
            into a single userop so they commit atomically.
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        netUsdc:
          description: USDC delivered to the recipient (gross - fee).
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        feeUsdc:
          description: USDC routed to the B0X fee recipient.
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        feeBps:
          description: Outflow fee in basis points (10000 = 100%).
          type: integer
          minimum: 0
          maximum: 10000
        feeRecipient:
          description: B0X fee-recipient EVM address; null when fee=0.
          type:
            - string
            - 'null'
        gasEstimateUsdc:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        requiresStepUp:
          type: boolean
        requiredFactors:
          type: array
          minItems: 2
          items:
            type: string
            enum:
              - passkey
              - email_otp
              - totp
              - sms
              - hardware_key
    WithdrawalStepUpRequired:
      type: object
      required:
        - code
        - factors
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - withdrawal.requires_step_up
        factors:
          type: array
          minItems: 2
          items:
            type: string
            enum:
              - passkey
              - email_otp
              - totp
              - sms
              - hardware_key
        satisfied:
          type: array
          items:
            type: string
            enum:
              - passkey
              - email_otp
              - totp
              - sms
              - hardware_key
        enrolledExtraFactors:
          description: The extra factors this user has enrolled and may choose from.
          type: array
          items:
            type: string
            enum:
              - totp
              - sms
              - hardware_key
    OnrampSession:
      type: object
      required:
        - hostedUrl
        - sessionToken
        - expiresAt
      additionalProperties: false
      properties:
        hostedUrl:
          type: string
          format: uri
        sessionToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    SpendPermissionSummary:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
            - none
        capUsdc:
          type:
            - string
            - 'null'
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        usedUsdc:
          type:
            - string
            - 'null'
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        remainingUsdc:
          type:
            - string
            - 'null'
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        perTxUsdc:
          type:
            - string
            - 'null'
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        period:
          type:
            - string
            - 'null'
          enum:
            - day
            - week
            - month
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
    SmsVerificationStart:
      type: object
      additionalProperties: false
      properties:
        phone:
          description: E.164 phone number; omit to use the user's verified account phone.
          type: string
          pattern: ^\+[1-9][0-9]{6,14}$
    SmsVerificationCheck:
      type: object
      required:
        - code
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[0-9]{4,8}$
    AgentApiKeyCreate:
      type: object
      required:
        - label
        - scopes
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 80
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          minItems: 1
    AgentWebhookCreate:
      type: object
      required:
        - url
        - events
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          minItems: 1
    TransactionsExportQuery:
      type: object
      required:
        - format
      additionalProperties: false
      properties:
        agentId:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - pending
            - confirmed
            - failed
            - dropped
        direction:
          type: string
          enum:
            - inbound
            - outbound
        format:
          type: string
          enum:
            - csv
  responses:
    BadRequest:
      description: Validation, malformed input, or missing/invalid `X-Network`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            requestInvalid:
              summary: Body failed Zod validation
              value:
                error:
                  code: request.invalid
                  message: Request body failed validation.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
                  details:
                    issues:
                      - path:
                          - name
                        message: Required
            networkHeaderRequired:
              summary: X-Network header missing
              value:
                error:
                  code: network.header_required
                  message: X-Network header is required on workspace-scoped routes.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
    Unauthorized:
      description: Missing or invalid bearer token / API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missingToken:
              value:
                error:
                  code: auth.missing_token
                  message: Authorization header missing.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
    Forbidden:
      description: Token valid but scope insufficient (or network mode locked).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            scopeInsufficient:
              value:
                error:
                  code: auth.forbidden
                  message: Token scope insufficient for this operation.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
    NotFound:
      description: Resource id resolved to no row, or row was scoped out by workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            resourceNotFound:
              value:
                error:
                  code: resource.not_found
                  message: Resource not found.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
    Conflict:
      description: Unique-constraint violation or idempotency-key hash mismatch.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            idempotencyConflict:
              value:
                error:
                  code: idempotency.conflict
                  message: Idempotency-Key reused with a different request body.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
    Gone:
      description: Soft-deleted resource, expired session, or expired upload URL.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaType:
      description: Content-Type other than `application/json` on a JSON route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Request body exceeded the per-route limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Business-rule violation (spend cap, virus scan, evidence invalid).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit exceeded. `Retry-After` header is set.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds the client should wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: Last-resort fallback; never includes a stack trace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unhandled:
              value:
                error:
                  code: internal.unhandled
                  message: Internal server error.
                  requestId: 01HQX5NXY2P3W2YGJ8ZQK5V4G6
    BadGateway:
      description: Upstream (RPC / chain provider) rejected the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: A `/ready` dependency is degraded or upstream RPC returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
x-blockchain0x-apikey-scope-labels:
  - wire: read_wallet_metadata
    label: Read wallet metadata
    summary: See balances, transactions, history, and limits.
    description: |
      Read-only access to balances, transactions, earnings, audit log,
      spend permissions, payment requests, and usage telemetry. The
      minimum scope for any monitoring or reporting agent.
    icon: eye
    sortOrder: 10
  - wire: manage_wallet_metadata
    label: Manage wallet metadata
    summary: Includes read. Also update profile copy (tagline, social, about).
    description: |
      Superset of "Read wallet metadata". Additionally lets the agent
      update its public-facing profile - tagline, about, SEO copy,
      social links, activity-chart visibility, and avatar URL. Identity
      (name, slug, public visibility, disabled flag) stays
      dashboard-only.
    icon: pencil
    sortOrder: 20
  - wire: pay_bills
    label: Send payments (pay bills)
    summary: Outbound payments, capped by the spend allowance.
    description: |
      Create outbound payments via the SDK or x402 client. Every payment
      is gated by the spend permission you configured for this agent -
      the API key cannot raise the cap. Combine with "Read" for an
      agent that reconciles its own outflows.
    icon: send
    sortOrder: 30
  - wire: receive_money
    label: Receive payments
    summary: Create invoices, settle them with on-chain proof.
    description: |
      Create payment requests (invoices) and settle them on-chain via
      x402. Settlement requires a confirmed transaction hash; the
      backend verifies all four of (txHash, payer, amount, recipient)
      before flipping the invoice to "settled". Required for any agent
      that sells anything.
    icon: inbox
    sortOrder: 40
