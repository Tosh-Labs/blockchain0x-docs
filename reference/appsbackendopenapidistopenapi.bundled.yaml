            refuse to serve `private` rows (404). See 16.8.B0.
        chainId:
          type: string
          description: CAIP-2 chain id, e.g. `eip155:8453` (Base mainnet).
        network:
          $ref: '#/components/schemas/Network'
        ogImageUrl:
          type:
            - string
            - 'null'
          description: |
            Absolute URL of the per-slug Open Graph image. Always
            populated for public wallets (the route falls back to a
            committed static PNG when the worker has not yet generated
            a custom image); null for soft-deleted or private rows.
        avatarUrl:
          type:
            - string
            - 'null'
          description: |
            Relative URL of the owner-uploaded wallet logo. Null when no
            avatar is set; the public page then falls back to the OG
            image followed by a gradient + initial.
        tagline:
          type:
            - string
            - 'null'
          maxLength: 140
        aboutMd:
          type:
            - string
            - 'null'
          maxLength: 8000
        seoTitle:
          type:
            - string
            - 'null'
          maxLength: 70
        seoDescription:
          type:
            - string
            - 'null'
          maxLength: 200
        seoKeywords:
          type:
            - array
            - 'null'
          items:
            type: string
        socialLinks:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AgentSocialLinks'
        showActivityChart:
          type: boolean
        visibility:
          description: |
            Public-facing entitlement flags derived from the wallet's
            plan + active addons (12.1 billing). Drives premium UI cues
            on the public page (verified tick, premium ribbon, etc).
          type: object
          required:
