                additionalProperties: false
                properties:
                  draft:
                    oneOf:
                      - $ref: '#/components/schemas/AgentDraft'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: agentsDraftsUpsertActive
      summary: Upsert the authenticated user's active wizard draft.
      description: |
        Idempotent upsert. Creates the active draft if none exists,
        then advances `currentStep` (when `step` is provided) and
        merges `state` (top-level JSONB merge - nested objects are
        replaced, not deeply merged). Forward step jumps of more than
        one are rejected with `onboarding.invalid_transition`.
      x-blockchain0x-network-exempt: true
      x-blockchain0x-examples-exempt: true
      tags:
        - agents
      x-blockchain0x-apikey:
