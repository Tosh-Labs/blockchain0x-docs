        requested window with `calls` + `errors` counts. Gap-filled
        server-side so the chart can plot directly without interpolating.

        Agent-scoped API keys see only their own agent's rollup; a
        caller-supplied `agentId` that disagrees with the key fence is
        rejected as `apikey.agent_mismatch` (AK-32). Workspace-scope
        keys (future) and cookie/JWT callers may pass `agentId` to drill
        down.
      tags:
        - api-keys
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      parameters:
        - in: query
          name: windowDays
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
        - in: query
          name: granularity
          schema:
            type: string
            enum:
              - day
            default: day
        - in: query
          name: agentId
          schema:
            type: string
            format: uuid
        - in: query
          name: apiKeyId
          schema:
            type: string
            format: uuid
        - in: query
          name: mode
          schema:
            type: string
            enum:
              - test
              - live
      responses:
        '200':
          description: Rollup for the requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyUsage'
              example:
                windowDays: 30
                granularity: day
                series:
                  - d: '2026-05-28'
                    calls: 142
                    errors: 0
                  - d: '2026-05-29'
                    calls: 120
                    errors: 3
                totals:
                  calls: 262
                  errors: 3
                scope:
                  workspaceId: ws_01HQX5
                  agentId: agt_01HQX5
                  apiKeyId: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
