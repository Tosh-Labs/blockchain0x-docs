      summary: Cancel a payment request.
      tags:
        - payment-requests
      x-blockchain0x-apikey:
        mode: block
      parameters:
        - $ref: '#/components/parameters/XNetworkHeader'
      responses:
        '204':
          description: Payment request cancelled.
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/payment-requests/by-id/{paymentRequestId}:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: paymentRequestId
        required: true
        schema:
          type: string
          format: uuid
        description: Internal UUID of the invoice.
    get:
      operationId: paymentRequestsGetById
      summary: Singleton lookup by internal UUID (sub-plan 21.2 row A-2).
      description: >
        Distinct path from the public
        `/v1/payment-requests/{paymentRequestToken}`

        GET because the latter accepts the hosted-URL token (`tok_*`) and

        intentionally elides invoice metadata for unauthenticated callers.

        This route requires a valid bearer (cookie or API key) and returns

        the full invoice shape, agent-fenced for API-key callers.
      tags:
        - payment-requests
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      responses:
        '200':
          description: Payment request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/payment-requests/{paymentRequestId}/settle:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: paymentRequestId
        required: true
        schema:
          type: string
          format: uuid
        description: Internal UUID of the invoice (NOT the public hosted-URL token).
    post:
      operationId: paymentRequestsSettle
      summary: |
        Settle an invoice with on-chain proof (sub-plan 21.2 x402 flow).
      description: |
        The payee agent calls this after the payer's on-chain transfer
        confirms. The backend verifies the supplied (txHash, payerAddress,
        amountUsdcVerified) tuple against `transactions` before flipping
        the invoice to `settled` and firing `invoice.settled`. Verification
        failures fire `invoice.settlement_failed`.
      tags:
        - payment-requests
      x-blockchain0x-apikey:
        mode: allow
        scope: receive_money
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestSettleBody'
            example:
              txHash: >-
                0x4e2b1f8a9d4c5e7f6a8b9c0d1e2f3a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5
              payerAddress: '0xabcdef0123456789abcdef0123456789abcdef01'
              amountUsdcVerified: '0.10'
      responses:
        '200':
          description: Invoice settled.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                  - settledTxHash
                  - settledAt
                additionalProperties: false
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                      - settled
                  settledTxHash:
                    type: string
                  settledAt:
                    type: string
                    format: date-time
              example:
                id: pr_01HQX5
                status: settled
                settledTxHash: >-
                  0x4e2b1f8a9d4c5e7f6a8b9c0d1e2f3a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5
                settledAt: '2026-05-29T12:34:56Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Agent mismatch (invoice belongs to a different agent), or the
            caller's key is not agent-scoped.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Invoice is no longer in `open` state, OR on-chain verification
            failed (tx not found / unconfirmed, recipient mismatch, amount
            mismatch). The error code distinguishes the case:
            `payment_request.not_settleable`,
            `invoice.settlement_unconfirmed`,
            `invoice.settlement_recipient_mismatch`,
            `invoice.settlement_amount_mismatch`.
  /v1/payments:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
    get:
      operationId: paymentsList
      summary: List payments for the workspace.
      tags:
        - payments
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payment list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
              example:
                data:
                  - id: pmt_01HQX5
                    agentId: agt_01HQX5
                    amountWei: '1000000000000000'
                    status: completed
                    network: mainnet
                page:
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: paymentsCreate
      summary: Submit an autonomous payment.
      description: |
        `Idempotency-Key` is REQUIRED. The session key signs in OpenBao
        Transit; the server never holds a user private key.
      tags:
        - payments
      x-blockchain0x-apikey:
        mode: allow
        scope: pay_bills
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            example:
              agentId: agt_01HQX5
              to: 0xdef...
              amountWei: '1000000000000000'
              metadata:
                orderId: ord_42
      responses:
        '201':
          description: Payment submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: pmt_01HQX5
                agentId: agt_01HQX5
                amountWei: '1000000000000000'
                status: pending
                txHash: 0xabc...
                network: mainnet
        '402':
          $ref: '#/components/responses/UnprocessableEntity'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
    get:
      operationId: paymentsGet
      summary: Get a payment.
      tags:
        - payments
      x-blockchain0x-apikey:
        mode: allow
        scope: read_wallet_metadata
      responses:
        '200':
          description: Payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: pmt_01HQX5
                agentId: agt_01HQX5
                amountWei: '1000000000000000'
                status: completed
                txHash: 0xabc...
                network: mainnet
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/uploads/sign:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
    post:
      operationId: uploadsSign
      summary: Get a pre-signed URL for an object upload.
      tags:
        - uploads
      x-blockchain0x-apikey:
