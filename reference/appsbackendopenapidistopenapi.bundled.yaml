    AuditEntityType:
      type: string
      enum:
        - workspace
        - agent
        - member
        - passkey
        - session
        - api_key
        - webhook
        - payment_request
        - withdrawal
        - spend_permission
        - export
        - user
        - notification
        - pay_session
        - referral
      description: |
        Canonical entity-type discriminator written into
        `audit_log.entity_type`. Mirrors the frozen list in
        `packages/shared/src/security/audit.ts` (sub-plan 16.7.A1).
    AuditActorRef:
      type: object
      required:
        - kind
        - displayName
        - email
      additionalProperties: false
      properties:
        userId:
          type:
            - string
            - 'null'
        displayName:
          type: string
        email:
          type: string
        avatarUrl:
          type:
            - string
            - 'null'
        kind:
          type: string
          enum:
            - user
            - system
            - agent
            - api_key
      description: |
        Server-resolved actor for an audit-log row. The backend joins
        `users`, agent rows, and api-key rows in a single LEFT JOIN pass
        (sub-plan 16.7.B1) so the web-app never does N+1 lookups. System
        events (no `actor_id`) render with `kind='system'`,
        `displayName='System'`, and `email=''`. Agent-as-actor and
        api-key-as-actor surface the agent display name / api-key label
        respectively.
    AuditEntityRef:
      type: object
      required:
        - id
        - type
        - name
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/AuditEntityType'
        name:
          type: string
        href:
          type:
            - string
            - 'null'
      description: |
        Server-resolved entity for an audit-log row. `name` is the
        human-readable label (workspace name, agent display name, passkey
        label, ...). `href` is an in-app link target when one exists
        (e.g. `/wallets/{agentId}` for agents). Deleted entities surface
        `name='(deleted)'` with a null `href`.
    AuditLogEntry:
      type: object
      required:
        - id
        - actor
        - action
        - occurredAt
      additionalProperties: false
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        entity:
          type:
            - string
            - 'null'
        details:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
        actorRef:
          $ref: '#/components/schemas/AuditActorRef'
          description: |
            Server-resolved actor (added in sub-plan 16.7.A2). Always
            present on responses from the enriched route; absent on
            legacy callers that still read `actor` only.
        entityRef:
          oneOf:
            - $ref: '#/components/schemas/AuditEntityRef'
            - type: 'null'
          description: |
            Server-resolved entity (added in sub-plan 16.7.A2). May be
