      - $ref: '#/components/parameters/XNetworkHeader'
    get:
      operationId: earningsAvailableToWithdraw
      summary: Latest USDC balance per agent (workspace withdrawable total).
      description: |
        Sub-plan 16.6.B6. Reads the most recent `balances` row per
        `(agent_wallet_id, asset='USDC', network=X-Network)` and sums to
        the workspace total. `stale=true` when any agent's snapshot is
        older than one hour.
      tags:
        - earnings
      x-blockchain0x-apikey:
        mode: block
      responses:
        '200':
          description: Withdrawable USDC.
          content:
            application/json:
              schema:
                type: object
                required:
                  - availableUsdc
                  - perAgent
                  - stale
                additionalProperties: false
                properties:
                  availableUsdc:
                    type: string
                    pattern: ^[0-9]+$
                  stale:
                    type: boolean
                  perAgent:
                    type: array
                    items:
                      type: object
                      required:
                        - agentId
                        - availableUsdc
                        - stale
                      additionalProperties: false
                      properties:
                        agentId:
                          type: string
                        availableUsdc:
                          type: string
                          pattern: ^[0-9]+$
                        stale:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
