        '202':
          description: OTP queued for direct send.
          content:
            application/json:
              schema:
                type: object
                required:
                  - requestId
                  - expiresInSeconds
                properties:
                  requestId:
                    type: string
                  expiresInSeconds:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{agentId}/withdrawals/quote:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    post:
      operationId: agentsWithdrawalQuote
      summary: Quote a USDC withdrawal and preview the step-up gate.
      description: >
        Validates the recipient (shape, self-send, B0X infra denylist), confirms

        the wallet holds enough USDC, and previews which auth factors the
        execute

        call will require (sub-plan 16.5.B2). Passkey + email OTP are always

        required; one additional enrolled 2FA factor is required when the amount

        exceeds the stricter of the 500-USDC product floor and the caller's

        per-user large-withdrawal threshold. Requires Admin on the wallet.
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalPrepareRequest'
            example:
              toAddress: '0x2222222222222222222222222222222222222222'
              amountUsdc: '125.50'
      responses:
        '200':
          description: Withdrawal quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalQuote'
              example:
                netUsdc: '125.5'
                gasEstimateUsdc: '0.01'
                requiresStepUp: false
                requiredFactors:
                  - passkey
                  - email_otp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/agents/{agentId}/withdrawals/prepare:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    post:
      operationId: agentsWithdrawalPrepare
      summary: Prepare an unsigned withdrawal userOp for browser passkey signing.
      description: |
        Composes the chain-aware withdrawal rig, builds the atomic two-leg
        userOp (USDC.transfer to recipient + optional USDC.transfer to the
        B0X fee recipient), stages it, and returns the userOpHash the browser
        must sign with the user's passkey. The signed assertion is then sent
        to POST /v1/agents/{agentId}/withdrawals (execute), which wraps it
        in CSW's SignatureWrapper and forwards to the bundler.
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalPrepareRequest'
            example:
              toAddress: '0x2222222222222222222222222222222222222222'
              amountUsdc: '125.50'
      responses:
        '200':
          description: Unsigned userOp prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalPrepareResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Insufficient balance or amount too small after fees.
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          description: Fee-recipient or chain-rig composition temporarily unavailable.
  /v1/agents/{agentId}/withdrawals/{transactionId}/receipt:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
      - in: path
        name: transactionId
        required: true
        schema:
          type: string
    get:
      operationId: agentsWithdrawalReceipt
      summary: Poll bundler for a submitted withdrawal's on-chain receipt.
      description: |
        Calls `eth_getUserOperationReceipt(userOpHash)` against the bundler.
        Returns `pending` until the bundler mines the userOp; once mined,
        back-fills tx_hash + flips status to `confirmed` (or `failed` on
        revert).
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: block
      responses:
        '200':
          description: Receipt status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/{agentId}/withdrawals:
    parameters:
      - $ref: '#/components/parameters/XNetworkHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - in: path
        name: agentId
        required: true
        schema:
          type: string
    post:
      operationId: agentsWithdrawalExecute
      summary: Submit a signed withdrawal userOp to the bundler.
      description: |
        Loads the staged userOp by userOpHash, verifies email OTP + (large)
        step-up factor, wraps the browser's WebAuthn signature in CSW's
        SignatureWrapper, attaches it to the staged userOp, and forwards to
        the bundler via `eth_sendUserOperation`. Requires Admin on the wallet.
        Blocked with 403 demo.action_blocked on mainnet in demo mode. A
        missing factor returns 422 WithdrawalStepUpRequired.
      tags:
        - agents
      x-blockchain0x-apikey:
        mode: block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalInitiate'
            example:
              userOpHash: '0xabc123'
              signature:
                signatureBytes: 0xabcd...ef01
                authenticatorData: AAECAwQ
                clientDataJSON: e30
              emailOtp: '123456'
      responses:
        '200':
          description: Withdrawal submitted to the bundler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalExecuteResult'
              example:
                transactionId: txn_01HQX5
                userOpHash: '0xdeadbeef'
                status: submitted
                txHash: '0xdeadbeef'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Either the request is missing a required step-up factor,
            or one of the supplied factors failed verification. The
            response body distinguishes the two via the `error.code`:
              - `withdrawal.requires_step_up` (factor missing)
              - `withdrawal.otp_invalid` (email OTP wrong / expired)
              - `withdrawal.passkey_invalid` (passkey assertion failed)
              - `withdrawal.factor_invalid` (extra factor failed)
              - `wallet.insufficient_balance`
              - `withdrawal.amount_too_small` (after fee deduction)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalStepUpRequired'
              example:
                code: withdrawal.requires_step_up
                factors:
                  - passkey
                  - email_otp
                  - totp
                satisfied:
                  - passkey
                  - email_otp
                enrolledExtraFactors:
                  - totp
        '502':
          $ref: '#/components/responses/BadGateway'
