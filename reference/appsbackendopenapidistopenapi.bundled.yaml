        '200':
          description: Draft created or updated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - draft
                additionalProperties: false
                properties:
                  draft:
                    $ref: '#/components/schemas/AgentDraft'
        '400':
          description: Invalid step transition or bad body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
